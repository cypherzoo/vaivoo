  - id: claim-eidas2-private-rp-acceptance
    predicate: private_relying_party_acceptance_obligation
    value: conditional
    statement: Under Article 5f(2), private relying parties required by Union or national law, or by contract, to use strong user authentication for online identification must accept wallets at the user's voluntary request. This applies in sectors such as transport, energy, banking, financial services, social security, health, drinking water, postal services, digital infrastructure, education and telecoms. The duty starts no later than 36 months after the Article 5a(23) and 5c(6) implementing acts enter into force. Micro and small enterprises are exempt.
    scope: Private relying parties covered by Article 5f(2). The calendar date depends on when the implementing acts entered into force.
    assumptions:
      - Applies only where strong user authentication for online identification is required by law or contract.
      - Applies only on the user's voluntary request; micro and small enterprises (Recommendation 2003/361/EC) are excluded.
    claim_type: fact
