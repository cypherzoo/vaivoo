  - id: claim-totp-validation-window
    predicate: validation_window
    value: supported
    statement: "Verifiers are expected to accept OTPs from a small, bounded window of time steps to absorb network delay and clock drift. RFC 6238 recommends allowing at most one time step for network delay."
    scope: Verifier policy guidance in RFC 6238; exact window is a deployment choice.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: Section 5.2 (Validation and Time-Step Size)
        note: Validators should set a transmission-delay window and also check past time steps; larger windows expose more attack surface; recommends at most one time step for delay.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: Section 6 (Resynchronization)
        note: Recommends limiting how many time steps a prover may be out of sync, forward or backward; the validator may record detected drift per token.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 3.1.4 Single-Factor OTP, subsection 'Single-Factor OTP Verifiers' (anchor #single-factor-otp-verifiers)"
        note: TOTPs must have a defined lifetime set by expected clock drift in either direction plus allowance for network delay and user entry.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-totp-phishing-resistance
    predicate: phishing_resistance
    value: not_supported
    statement: TOTP is not phishing-resistant. The user types the code by hand, and the code is not cryptographically bound to the verifier's name or to the session, so a fake site can relay it to the real verifier while it is still valid.
    scope: TOTP as an authentication mechanism, whether single-factor or multi-factor OTP; surrounding controls not assessed.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: Sec. 3.2.5 Phishing Resistance
        note: Manually entered authenticator outputs, explicitly including OTP, shall not be considered phishing-resistant because entry does not bind output to the session; an impostor can relay it.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 3.2.5 Phishing Resistance, subsections 'Channel Binding' and 'Verifier Name Binding'"
        note: Phishing resistance requires cryptographic authentication with channel binding or an output cryptographically bound to an authenticated verifier identifier. TOTP output includes neither.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: Sec. 3.1.4 Single-Factor OTP; Sec. 3.1.5 Multi-Factor OTPs
        note: Both OTP sections state directly that OTP authentication is not phishing-resistant.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-totp-replay-resistance
    predicate: replay_resistance
    value: conditional
    statement: TOTP resists replay only if the verifier refuses a code that has already been accepted. A TOTP code stays the same for its whole time step, so without that check the same code could be used again within its validity window.
    scope: Verifier-side behaviour; does not cover real-time relay (see phishing_resistance).
    assumptions:
      - "The verifier records successful validations (for example, the last accepted time step per credential) and rejects any second use of the same OTP while it is still valid."
      - The OTP is collected over an authenticated protected channel.
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: "Section 5.2 (Validation and Time-Step Size), final paragraph"
        note: OTPs within one time step are identical; the verifier MUST NOT accept a second attempt after a successful validation, ensuring one-time use.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 3.1.4 Single-Factor OTP, subsection 'Single-Factor OTP Verifiers' (anchor #single-factor-otp-verifiers)"
        note: Verifiers shall accept a given OTP only once while valid, to provide replay resistance, and shall collect OTPs over an authenticated protected channel.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: Sec. 3.2.7 Replay Resistance
        note: Lists OTP authenticators among replay-resistant authenticator examples, based on nonce or timeliness data that makes old messages detectable.
        stance: contextualizes
        retrieved_at: "2026-10-03"
  - id: claim-totp-shared-secret-server-side
    predicate: shared_secret_server_side
    value: supported
    statement: The verifier holds a copy of each user's symmetric TOTP key, because it has to recompute codes to check them. That key store has to be protected, since anyone who reads it can generate valid codes.
    scope: All TOTP deployments (inherent to the symmetric design).
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
