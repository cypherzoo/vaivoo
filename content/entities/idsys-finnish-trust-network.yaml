  - id: claim-ftn-legal-basis
    predicate: legal_basis
    value: supported
    statement: The Finnish Trust Network is set up by the Act on Strong Electronic Identification and Electronic Trust Services (617/2009). Section 2(10) defines it as the network of identification service providers that have notified Traficom. Under section 12a, a provider joins it by making the section 10 notification. Traficom says the network has operated since 1 May 2017.
    scope: Consolidated Finnish text on Finlex at retrieval, including amendments by 811/2026 in force 1.10.2026. The English translation is marked by Traficom as not up to date.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.finlex.fi/fi/lainsaadanto/2009/617
        title: Laki vahvasta sähköisestä tunnistamisesta ja sähköisistä luottamuspalveluista 617/2009
        publisher: Finlex (Ministry of Justice, Finland)
        version: Consolidated text incl. amendment 811/2026
        locator: "Section 2 point 10; section 12 a (29.3.2019/412), first paragraph"
        note: (Finnish) The trust network is the network of identification service providers that have notified Traficom; a provider joins by making the section 10 notification.
        stance: supports
        retrieved_at: 2026-10-03
