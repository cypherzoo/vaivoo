  - id: claim-synced-passkey-uv-uv-required
    predicate: user_verification_required
    value: supported
    statement: "In this profile the Relying Party sets userVerification to \"required\"; the client must return an error if it cannot verify the user, and the Relying Party rejects responses without the UV flag set."
    scope: Holds by configuration of this profile; WebAuthn itself also allows "preferred" and "discouraged".
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§5.8.6 User Verification Requirement Enumeration (enum UserVerificationRequirement), value \"required\""
        note: With required, the RP fails the ceremony without the UV flag, and the client must error if user verification cannot be performed.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§6.1 Authenticator Data (flags bit 2, User Verified); §7.2 Verifying an Authentication Assertion (UV step)"
        note: UV flag is set only if the authenticator performed user verification; RP must verify UV when verification is required.
        stance: supports
        retrieved_at: 2026-10-03
