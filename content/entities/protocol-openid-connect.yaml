    predicate: defines
    value: supported
    statement: "OpenID Connect 1.0 is an identity layer on top of OAuth 2.0. It lets clients verify the user's identity based on authentication performed by an Authorization Server (OpenID Provider) and obtain basic profile information."
    scope: Purpose and relationship to OAuth 2.0 as stated in OpenID Connect Core 1.0.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://openid.net/specs/openid-connect-core-1_0.html
        title: OpenID Connect Core 1.0 incorporating errata set 2
        publisher: OpenID Foundation
        version: "Final, incorporating errata set 2, December 15, 2023"
        locator: "Abstract; §1 Introduction (#Introduction)"
        note: Defines OIDC as a simple identity layer on OAuth 2.0; OAuth alone cannot convey End-User authentication; requested via the openid scope.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-oidc-authentication-method-out-of-scope
    predicate: specifies_authentication_method
    value: not_supported
    statement: "OpenID Connect does not specify how the End-User is authenticated. The OpenID Provider authenticates the user by methods outside the specification and OpenID Connect conveys the result in an ID Token, so it is a federation protocol rather than an authenticator."
    scope: "Core 1.0. The \"federation protocol, not an authenticator\" framing is an editorial interpretation of the cited text."
    assumptions: []
    claim_type: interpretation
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
