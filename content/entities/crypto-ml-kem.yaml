  - id: claim-ml-kem-quantum-resistance
    predicate: quantum_resistance
    value: supported
    statement: NIST states that ML-KEM is presently believed to be secure even against adversaries with a large-scale fault-tolerant quantum computer. Its security rests on the presumed hardness of the Module Learning With Errors problem, and it is believed to achieve IND-CCA2 security.
    scope: NIST's assessment as stated in the standard; a belief based on current cryptanalysis, not a proof.
