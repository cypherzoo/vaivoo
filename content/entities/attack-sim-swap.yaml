        retrieved_at: "2026-10-03"
  - id: claim-sim-swap-defeats-sms-otp
    predicate: defeats_sms_otp
    value: supported
    statement: "A successful SIM swap defeats SMS and voice one-time codes, because the codes are delivered to whoever holds the number. CISA lists SMS and voice MFA as vulnerable to SIM swap, and NIST gives an operator redirecting a victim's phone as an example of how an attacker receives an SMS code."
    scope: SMS and voice (PSTN) delivery of out-of-band secrets.
    assumptions: []
