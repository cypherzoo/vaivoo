    statement: SHA-2 is used throughout authentication protocols. TOTP may use HMAC-SHA-256 or HMAC-SHA-512 instead of HMAC-SHA-1. The common COSE signature identifiers used by WebAuthn and CTAP, such as RS256, PS256 and ESP256, all hash with SHA-256. FIPS 186-5 requires approved hash functions for RSA and ECDSA signatures.
    scope: Selected authentication standards; not an exhaustive list of where SHA-2 appears.
