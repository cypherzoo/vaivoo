        retrieved_at: "2026-10-03"
  - id: claim-sk2f-max-nist-aal
    predicate: max_nist_aal
    value: conditional
    statement: "This profile meets the AAL2 authenticator combination. It can also reach AAL3, because NIST permits a single-factor cryptographic authenticator used together with a password, provided the key is non-exportable, phishing-resistant, replay-resistant, demonstrates authentication intent and is FIPS 140 validated."
    scope: NIST SP 800-63B-4; AAL3 additionally requires its reauthentication and verifier requirements.
    assumptions:
      - "The security key's private key is non-exportable as defined in NIST 'Exportability'."
      - "The key demonstrates authentication intent (for example, a touch per authentication) as required by Sec. 3.2.8."
      - "The authenticator is validated to FIPS 140 Level 1 or higher overall, and verifier cryptography is validated at Level 1 or higher."
      - "The Relying Party verifies origin binding so that phishing resistance holds."
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 2 'Authentication Assurance Level 3' > 'Permitted Authenticator Types' (#aal3types)"
        note: AAL3 SHALL use MF cryptographic, or SF cryptographic used with either a password or a biometric comparison.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 2.3.2 Authenticator and Verifier Requirements (#aal3req)"
        note: Non-exportable private key, phishing resistance, replay resistance, authentication intent, public-key crypto and FIPS 140 Level 1 validation are required.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
