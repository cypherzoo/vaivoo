        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: "Section 3 (Algorithm Requirements), R2; Section 5.1 (General)"
        note: Prover and verifier MUST share the secret or a secret transformation; keys should be stored encrypted in the validation system, in a secure area.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 3.1.4 Single-Factor OTP, subsection 'Single-Factor OTP Verifiers' (anchor #single-factor-otp-verifiers)"
        note: Verifiers duplicate OTP generation, so the authenticators' symmetric keys are also present in the verifier and shall be strongly protected by access controls.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-totp-rate-limiting-required
    predicate: rate_limiting_required
    value: supported
    statement: "TOTP verifiers must rate-limit failed attempts because the truncated code is short enough to brute-force. NIST makes this a SHALL for OTP outputs under 64 bits and, unless otherwise specified for the authenticator, requires disabling the authenticator after no more than 100 consecutive failed attempts; deployments may impose lower limits."
    scope: Verifier requirement; the exact limit is a deployment choice within the NIST upper bound.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 3.1.4 Single-Factor OTP, subsection 'Single-Factor OTP Verifiers' (anchor #single-factor-otp-verifiers)"
        note: Verifier SHOULD rate-limit, and SHALL if authenticator output is under 64 bits, as described in Sec. 3.2.2.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: Sec. 3.2.2 Rate Limiting (Throttling)
        note: Unless otherwise specified, limit consecutive failed attempts per authenticator to no more than 100 by disabling it; the 100 figure is explained using a six-digit OTP.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc4226
        title: "RFC 4226: HOTP: An HMAC-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 4226 (December 2005)
        locator: Section 7.3 (Throttling at the Server); Section 7.1 (RP2)
        note: Truncation makes brute force possible, so the server needs throttling or increasing delays; lockout and delay schemes MUST apply across login sessions.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-totp-mfa-qualification
    predicate: mfa_qualification
    value: conditional
    statement: "A TOTP authenticator counts as multi-factor only in certain setups. A TOTP app or token with no activation factor is a single-factor OTP ('something you have') and reaches AAL2 only when combined with a password or biometric comparison. A TOTP authenticator that requires an activation factor every time it is used is a multi-factor OTP."
    scope: NIST SP 800-63B-4 AAL1/AAL2 classification; other regulatory regimes not assessed.
    assumptions:
      - "Single-factor case: the TOTP authenticator is combined with a separate password or biometric comparison in the same authentication."
      - "Multi-factor case: the authenticator requires a password or biometric activation factor on every use, meeting the Sec. 3.1.5 requirements."
      - At least one authenticator in the event is replay-resistant, as required at AAL2.
    claim_type: interpretation
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 2 Authentication Assurance Levels, 'Authentication Assurance Level 2' > 'Permitted Authenticator Types' (anchor #aal2types)"
        note: AAL2 needs a multi-factor authenticator (including MF OTP) or a physical authenticator such as SF OTP combined with a password or biometric comparison.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: Sec. 3.1.4 Single-Factor OTP; Sec. 3.1.5 Multi-Factor OTPs
        note: SF OTP needs no activation and is something you have; MF OTP requires an activation factor (password or biometric) on each use.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-totp-aal3-eligible
    predicate: aal3_eligible
    value: not_supported
    statement: TOTP cannot be used for NIST AAL3. AAL3 permits only cryptographic authenticators with a non-exportable private key that provide phishing resistance, and OTP authenticators are not on the permitted list.
    scope: NIST SP 800-63B-4 AAL3.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: SP 800-63B-4 (web edition dated 26 Aug 2025)
        locator: "Sec. 2 Authentication Assurance Levels, 'Authentication Assurance Level 3' > 'Permitted Authenticator Types' (anchor #aal3types) and 'Authenticator and Verifier Requirements' (anchor #aal3req)"
        note: AAL3 permits only MF cryptographic, or SF cryptographic plus password or biometric; requires a non-exportable private key and phishing resistance.
        stance: supports
        retrieved_at: "2026-10-03"
