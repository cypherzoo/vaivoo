name: RSA signatures (RSASSA-PKCS1-v1_5 and RSASSA-PSS)
aliases: ["RSA signatures", "RSASSA-PKCS1-v1_5", "RSASSA-PSS", "RS256 (COSE/JOSE)", "PS256 (COSE/JOSE)", "PKCS #1 signatures"]
summary: The two RSA signature schemes defined in PKCS #1 (RFC 8017) and approved in FIPS 186-5. They are widely used for certificates and some authenticators, need large keys (at least 2048 bits for NIST use), and would be broken by a large-scale quantum computer.
layer: [crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  RSA signatures let the holder of a private key sign data so that anyone with the matching public key can check it. RSA is the oldest public-key signature system still in wide use. It shows up in authentication mainly in certificates (for example the ones that secure web connections and identity documents), in tokens signed by identity providers, and in some security keys and platform authenticators; RSA is also common in TPM-based attestation.

  There are two standard ways to sign with RSA, both defined in PKCS #1. The older one, PKCS1-v1_5, is deterministic: the same message and key always give the same signature. The newer one, PSS, mixes in a random "salt" and has a stronger security proof. The PKCS #1 specification requires PSS for new applications and keeps v1_5 only for compatibility, although no practical attack on v1_5 signatures is known. NIST approves both.

  RSA keys and signatures are much larger than elliptic-curve ones. A 2048-bit RSA key, the minimum NIST allows for new signatures, gives about 112 bits of security; a 256-bit elliptic-curve key gives about 128. NIST's draft plans would push new signatures to at least 3072 bits after 2030, and RSA, like elliptic-curve signatures, is expected to be retired once quantum computers become a real threat.
crypto: |
  Primitive: n = pq with two primes of equal length; public key (n, e), private key (n, d) or its CRT form. Signing applies RSASP1 (s = m^d mod n) to an encoded message representative; verification applies RSAVP1 (m = s^e mod n) and checks the encoding (RFC 8017 Section 8). Security rests on the infeasibility of computing e-th roots modulo n, which is no harder than factoring n.

  Encodings (RFC 8017):
  - RSASSA-PKCS1-v1_5 (Section 8.2): deterministic EMSA-PKCS1-v1_5 padding that embeds a DigestInfo (hash OID + digest). Security is conjectured, not proven. FIPS 186-5 Section 5.4(h) adds strict DigestInfo parsing rules for verifiers, which guard against signature-forgery bugs from lax parsing.
  - RSASSA-PSS (Section 8.1): probabilistic EMSA-PSS encoding with a random salt and MGF1 mask generation. Its security proof is tight in the random-oracle model. RFC 8017 recommends the same hash for the message and MGF1. FIPS 186-5 limits the salt length to 0 ≤ sLen ≤ hLen.

  FIPS 186-5 constraints (Sections 5.1 and 5.4): modulus length even and ≥ 2048 bits; exactly two primes; public exponent odd with 2^16 < e < 2^256; approved hash (SHA-2, SHA-3, or SHAKE for PSS). The signature strength is capped by the weaker of the modulus and the hash. A signature is as long as the modulus: 256 bytes for 2048-bit n, 384 bytes for 3072-bit n.

  COSE identifiers: RS256 (-257) = RSASSA-PKCS1-v1_5 with SHA-256 (RFC 8812, Recommended: No); PS256 (-37) = RSASSA-PSS with SHA-256, MGF1-SHA-256, 32-byte salt (RFC 8230, Recommended: Yes). Both require keys of at least 2048 bits. RFC 9864 deliberately leaves the RSA identifiers unchanged.

  Quantum: NIST IR 8547 (initial public draft) lists RSA among the FIPS 186 signature algorithms vulnerable to Shor's algorithm.
