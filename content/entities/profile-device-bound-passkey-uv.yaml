claims:
  - id: claim-device-bound-passkey-uv-phishing-resistance
    predicate: phishing_resistance
    value: conditional
    statement: "Sign-in with a device-bound passkey is phishing-resistant through verifier name binding: the credential is scoped to the RP ID and the signed client data carries the origin, which the Relying Party verifies."
    scope: The WebAuthn authentication ceremony only. Account recovery, enrollment of further authenticators and session handling are assessed separately.
    assumptions:
      - The Relying Party verifies the client data origin and the rpIdHash exactly as in WebAuthn §7.2.
      - The RP ID is the site's domain or a parent domain at least one level below the public suffix.
      - The user's device and browser are not compromised.
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Sec. 3.2.5 Phishing Resistance, subsection \"Verifier Name Binding\" (#verifier-name-binding)"
        note: Output must be bound to an authenticated verifier identifier; WebAuthn is named as providing phishing resistance this way.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§7.2 Verifying an Authentication Assertion (steps verifying C.origin and rpIdHash)"
        note: RP must check the client-data origin is expected and that rpIdHash equals the SHA-256 of its expected RP ID.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-device-bound-passkey-uv-single-device
    predicate: non_exportable_key
    value: conditional
    statement: "With BE = 0 the credential is a single-device credential: its generating authenticator decides at creation that it may never be backed up, and the flag cannot change. This meets NIST's non-exportability only if the authenticator also keeps the key in separate hardware or an isolated execution environment."
    scope: "WebAuthn defines BE = 0 as a no-backup property of the credential; NIST non-exportability is a stronger, hardware-based requirement that the flag alone does not prove."
    assumptions:
      - The authenticator honestly reports BE = 0 (the flag is self-reported; attestation is needed to verify the authenticator type).
      - The key is generated, stored and used in separate hardware or an embedded secure element, TEE or TPM that the host cannot read or reprogram (NIST Sec. 3.2.12).
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§4 Terminology, \"Backup Eligibility / Backup Eligible\"; §6.1.3 Credential Backup State (BE/BS combinations table)"
        note: Generating authenticator fixes backup eligibility at creation; it is permanent. BE=0/BS=0 means single-device credential; BE=0/BS=1 is not allowed.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§6.1.3 Credential Backup State, item \"Requiring additional authenticators\""
        note: With BE=0 the generating authenticator will never allow the credential to be backed up.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Sec. 3.2.12 Exportability (#export)"
        note: Non-exportable requires separate hardware or an embedded secure element, TEE or TPM that blocks export to, and reprogramming by, the host processor.
        stance: contextualizes
        retrieved_at: 2026-10-03
  - id: claim-device-bound-passkey-uv-max-nist-aal
    predicate: max_nist_aal
    value: conditional
    statement: "This profile can reach AAL3 under NIST SP 800-63B-4, unlike the synced profile (AAL2 at most). AAL3 needs a cryptographic authenticator with a non-exportable private key and phishing resistance, plus the other AAL3 requirements."
    scope: NIST SP 800-63B-4 AAL3. If any assumption fails, the profile falls back to AAL2 at most (with UV) or lower.
    assumptions:
      - The private key is non-exportable in the sense of NIST Sec. 3.2.12 (hardware-isolated), not merely BE = 0.
      - Phishing resistance holds (see claim-device-bound-passkey-uv-phishing-resistance).
      - Authenticators are validated to FIPS 140 Level 1 or higher overall, and verifier cryptography is FIPS 140 validated.
      - Replay resistance, authentication intent, AAL3 reauthentication limits and the other AAL3 requirements are met.
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "AAL3, \"Authenticator and Verifier Requirements\" (#aal3req)"
        note: AAL3 authenticators shall have a non-exportable private key, provide phishing resistance, be replay-resistant and be FIPS 140 Level 1 validated; syncable authenticators are excluded.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
