id: crypto-ed25519
type: CryptographicPrimitive
slug: ed25519
name: Ed25519 (EdDSA)
aliases: ["Ed25519", "EdDSA with Ed25519", "Edwards25519 signatures"]
summary: The Edwards-curve Digital Signature Algorithm (EdDSA) on the edwards25519 curve. It is defined in RFC 8032 and approved in FIPS 186-5, gives about 128-bit classical security, and signs deterministically with 32-byte public keys and 64-byte signatures.
layer: [crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  Ed25519 is a digital signature scheme. A device signs with its private key, and anyone with the public key can check the signature. It does the same job as ECDSA with P-256 but was designed to be simpler to implement safely and to produce small keys and signatures.

  An important difference from ECDSA is that Ed25519 needs no fresh random number for each signature. The value used in signing is derived from the private key and the message, which removes a class of failures caused by bad randomness. Implementations still have to guard against side-channel and fault attacks.

  In WebAuthn and COSE, Ed25519 has been signalled as "EdDSA" (-8) with the curve set to Ed25519. Newer COSE rules add a dedicated "Ed25519" identifier (-19). Like other elliptic-curve schemes, Ed25519 would be broken by a large enough quantum computer.
crypto: |
  Curve: edwards25519, a twisted Edwards curve over GF(p) with p = 2^255 − 19, a = −1, d = −121665/121666 and cofactor 8 (SP 800-186 Section 3.2.3.1; RFC 8032 Section 5.1). It is birationally equivalent to Curve25519, the Montgomery curve used for X25519 key exchange. EdDSA is a variant of Schnorr signatures.

  Sizes (RFC 8032 Section 5.1.5 and 5.1.6): private key 32 octets of random data; public key 32 octets (encoded point); signature 64 octets (R || S, each 32 octets). The hash is SHA-512.

  Nonce: deterministic. The signing scalar r = SHA-512(prefix || M), where prefix is the second half of SHA-512(private key) (RFC 8032 Section 5.1.6). RFC 8032 Section 8.2 says this protects against bad-randomness attacks. FIPS 186-5 Section 7.1 repeats this and warns that deterministic schemes in hardware, embedded and smartcard devices need side-channel and fault-attack protection.

  Security level: about 128 bits classically (RFC 8032 Section 1; FIPS 186-5 Section 7.1; SP 800-186 Table 1). EdDSA and ECDH compute public values differently, so a public key from one should not be used with the other (RFC 9053 Section 2.2.1).
