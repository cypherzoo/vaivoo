id: profile-device-bound-passkey-uv
type: DeploymentProfile
slug: device-bound-passkey-uv
name: Device-bound passkey with required user verification
aliases: ["device-bound passkey (UV required)", "single-device WebAuthn credential with user verification", "non-backup-eligible passkey with UV"]
summary: "A deployment in which the website accepts passkeys that stay on one authenticator (a security key or a non-syncing device authenticator), and requires the authenticator to verify the user locally (PIN or biometric) on every sign-in."
layer: [core, crypto]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
configuration:
  user_verification: required
  credential_storage: single device; the generating authenticator never allows backup (non-exportable by design)
  backup_eligibility_flag: "BE = 0 expected (single-device credential); BS must then also be 0"
  attestation: possible (direct, or enterprise in managed deployments)
  discoverable_credential: typical (passkey)
  recovery: needs a second registered authenticator or an account-recovery flow
body: |
  The user creates a passkey on one authenticator, typically a hardware security key or a device authenticator that does not sync. The authenticator marks the credential as not backup-eligible (BE = 0), which WebAuthn calls a single-device credential: it is never copied to other devices.

  As in the synced profile, the website sets user verification to "required", so the user unlocks the passkey with a PIN or biometric on each sign-in, and the server rejects responses without the UV flag. Sign-in is bound to the website's domain, so a look-alike site cannot obtain a usable response.

  The difference from the synced profile lies in where the key lives. There is no passkey provider account through which the key could be recovered or copied, so that attack path disappears. The cost is availability: losing or breaking the device loses the credential. The website must therefore let users register a second authenticator or offer an account-recovery process, and that process often becomes the weakest link.

  Under NIST SP 800-63B-4 this profile can reach AAL3, but only when the key is non-exportable in NIST's hardware sense and the other AAL3 requirements are met. The BE = 0 flag alone does not prove hardware protection; attestation is the usual way for a website to check what kind of authenticator it is dealing with.
crypto: |
  Each passkey is a per-site key pair generated inside the authenticator. To sign in, the authenticator signs its authenticator data (SHA-256 hash of the RP ID plus the UP, UV, BE and BS flags) together with a SHA-256 hash of the client data, which contains the server's random challenge and the origin the browser saw. The server checks the signature with the stored public key and verifies origin, RP ID hash, the UV flag and that BE has not changed since registration.

  Algorithms are identified by COSE identifiers, for example -7 (ES256, P-256) and -8 (EdDSA, Ed25519).

  Unlike a synced passkey, the private key is meant never to leave the generating authenticator. NIST counts a key as non-exportable only when it is generated, stored and used in separate hardware or an isolated execution environment (secure element, TEE, TPM) that the host processor cannot read or reprogram. At registration, an attestation statement signed by the authenticator's attestation key can let the server check the authenticator model and how it stores keys.
