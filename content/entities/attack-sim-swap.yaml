  - id: claim-sim-swap-account-recovery
    predicate: recovery_dependency
    value: supported
    statement: "SIM swap is also used against account recovery. With the number in hand, attackers trigger 'forgot password' flows that send a code or link to the phone and take over the account. NIST notes that recovery is often the weak point of an authentication system."
    scope: Accounts whose password reset or recovery accepts proof of control of a phone number.
