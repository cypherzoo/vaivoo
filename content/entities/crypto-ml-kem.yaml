body: |
  ML-KEM lets two parties agree on a secret key over an open network, in a way that is believed to resist attackers with large quantum computers. One side publishes an "encapsulation key"; the other uses it to create a shared secret plus a short ciphertext, and sends the ciphertext back; the first side then recovers the same secret with its private "decapsulation key". The secret then protects ordinary symmetric encryption.

  ML-KEM is not a signature scheme. It cannot prove who someone is, so it does not replace the RSA or elliptic-curve signatures inside passkeys, security keys or certificates; that job falls to signature standards such as ML-DSA (FIPS 204). What ML-KEM protects is the connection: passwords, one-time codes, session cookies and tokens all travel inside TLS, and today's TLS key exchange could be recorded now and decrypted later by a future quantum computer. NIST calls this the "harvest now, decrypt later" threat and says it is a reason to move key exchange to post-quantum schemes early.

  In practice ML-KEM is deployed in "hybrid" form, combined with a classical elliptic-curve exchange so the connection stays secure if either part holds. The IETF published the TLS 1.3 hybrids, including the widely used X25519MLKEM768, as RFC 10024 in August 2026. ML-KEM comes in three sizes: ML-KEM-512, -768 and -1024. Keys and ciphertexts are around one to one and a half kilobytes, much larger than the 32 bytes of an X25519 share.
crypto: |
  Construction: a public-key encryption scheme, K-PKE, built on the Module Learning With Errors (MLWE) problem over a polynomial ring R_q with n = 256 and q = 3329. A Fujisaki–Okamoto (FO) transform turns it into a KEM believed to be IND-CCA2-secure (FIPS 203 Section 3.2; ring details in Section 4.3). It uses the NTT for fast polynomial multiplication. K-PKE is not approved as a stand-alone scheme (Section 3.3). Algorithms are ML-KEM.KeyGen, ML-KEM.Encaps and ML-KEM.Decaps (Algorithms 19 to 21). Encaps and Decaps output a 256-bit shared secret key.

  Parameter sets (FIPS 203 Section 3.2; sizes from RFC 9935 Appendix B, Table 1; bytes as encapsulation key / decapsulation key / ciphertext / shared secret):
  - ML-KEM-512: category 1; 800 / 1632 / 768 / 32; decapsulation failure rate 2^-138.8
  - ML-KEM-768: category 3; 1184 / 2400 / 1088 / 32; failure rate 2^-164.8
  - ML-KEM-1024: category 5; 1568 / 3168 / 1568 / 32; failure rate 2^-174.8
  NIST IR 8547 (ipd) Table 5 gives security strengths of 128, 192 and 256 bits.

  Implementation requirements (FIPS 203 Section 3.3): randomness from an approved RBG of at least 128, 192 or 256 bits of strength for the three sets; input checking before Encaps and Decaps; destruction of intermediate values; derandomised internal functions not exposed except for testing. If a combined KEM includes ML-KEM, its IND-CCA2 security is not automatic; NIST points to SP 800-227 for guidance on combined KEMs.

  TLS 1.3 hybrid (RFC 10024, Standards Track, August 2026): X25519MLKEM768 (codepoint 4588 / 0x11EC, Recommended Y) sends a 1216-byte client share (ML-KEM-768 encapsulation key 1184 + X25519 32) and a 1120-byte server share (ciphertext 1088 + 32). The 64-byte shared secret is the concatenation, ML-KEM part first. SecP256r1MLKEM768 (4587) and SecP384r1MLKEM1024 (4589) are also defined, with Recommended N. The server MUST run the FIPS 203 encapsulation-key check.
