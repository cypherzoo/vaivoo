name: SHA-2 hash functions (FIPS 180-4)
aliases: ["SHA-2", "SHA-256", "SHA-384", "SHA-512", "SHA-224", "SHA-512/256", "Secure Hash Standard"]
summary: The family of cryptographic hash functions specified in NIST FIPS 180-4 (SHA-224, SHA-256, SHA-384, SHA-512, SHA-512/224, SHA-512/256). SHA-2 sits underneath most authentication cryptography, from HMAC-based one-time passwords to RSA and ECDSA signatures, and NIST does not expect quantum computers to force a move away from SHA-256 and larger.
layer: [crypto]
status: draft
