claims:
  - id: claim-aitm-phishing-definition
    predicate: definition
    value: supported
    statement: "NIST defines phishing as a fraudulent verifier or relying party tricking a claimant into presenting an authenticator to an impostor, regardless of how the claimant was led there. MITRE ATT&CK describes adversary-in-the-middle as positioning between two parties to intercept data, including credentials, access tokens and session cookies."
    scope: Definitions only; NIST uses 'verifier impersonation' as the older term for the same attack.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.2.5 Phishing Resistance (#verifimpers), first two paragraphs"
        note: Phishing (formerly 'verifier impersonation') is an attempt by a fraudulent verifier or RP to get the claimant to present an authenticator to an impostor; how the claimant got there is irrelevant.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://attack.mitre.org/techniques/T1557/
        title: "Adversary-in-the-Middle, Technique T1557 - Enterprise"
        publisher: The MITRE Corporation (MITRE ATT&CK)
        version: "T1557 version 2.5 (ATT&CK v19), last modified 12 May 2026"
        locator: Technique description, first and second paragraphs
        note: Adversaries position themselves between networked parties and can use that position to intercept credentials, access tokens and session cookies.
        stance: supports
        retrieved_at: "2026-10-03"
