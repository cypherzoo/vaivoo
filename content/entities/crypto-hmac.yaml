id: crypto-hmac
type: CryptographicPrimitive
slug: hmac
name: HMAC
aliases: [Keyed-hash message authentication code, Keyed-Hashing for Message Authentication]
summary: A way to combine a secret key with a cryptographic hash function to produce a message authentication code. Only someone holding the key can compute or check it.
layer: [crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  HMAC lets two parties who share a secret key check that a message came from someone holding that key and was not changed on the way. Both sides compute a short tag from the key and the message, and the tags must match.

  HMAC is built from an ordinary hash function such as SHA-1 or SHA-256, used without modification, and the hash can be swapped out if a better one comes along. In authentication, one-time password schemes such as HOTP and TOTP use HMAC to turn a shared key and a counter or time value into an unpredictable number.
crypto: |
  RFC 2104 defines HMAC(K, text) = H((K XOR opad) || H((K XOR ipad) || text)). H is an iterated hash with block length B bytes. The key is zero-padded to B bytes, and ipad and opad are the bytes 0x36 and 0x5C repeated B times. Keys longer than B are hashed first.

  The recommended minimum key length is L bytes, where L is the hash output length. Shorter keys are strongly discouraged. Keys should be random and refreshed periodically (RFC 2104 Sections 2 and 3).

  Security rests on properties of the hash's compression function, used in a keyed setting. RFC 2104 notes that the best known generic attack is a birthday attack needing about 2^64 MACs under the same key for a 128-bit hash, or 2^80 for a 160-bit hash. RFC 2104 calls this impractical (Section 6).

  RFC 2104 allows truncated output but recommends keeping at least half the hash length and at least 80 bits (Section 5). HOTP and TOTP truncate much further, to about 31 bits and then to 6 to 8 decimal digits. RFC 4226 accepts that this makes brute force possible and relies on server-side throttling to compensate (RFC 4226 Section 7.3).
