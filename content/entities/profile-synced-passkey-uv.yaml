        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§1.2.1.2 Authentication (use case Consumer with Multi-Device Credentials)"
        note: Non-normative use case where the user signs in by giving only a PIN or biometric gesture to unlock the synced passkey.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://fidoalliance.org/passkeys/
        title: "FIDO Passkeys: Passwordless Authentication"
        publisher: FIDO Alliance (industry body)
        version: "Web page, last modified 2026-09-16 per page metadata"
        locator: "Passkeys FAQ: \"What is a passkey?\" and \"What are the use cases for passkeys?\""
        note: Industry body describes passkeys as FIDO credentials for passwordless authentication, mainly replacing the password as primary factor.
        stance: supports
