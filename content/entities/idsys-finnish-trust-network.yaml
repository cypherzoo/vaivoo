        publisher: Finnish Transport and Communications Agency Traficom (NCSC-FI)
        version: Page last updated 2026-09-03
        locator: "Section 'Trust network'"
        note: Providers that notified under 617/2009 and meet its requirements have formed a trust network since 1 May 2017.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-ftn-supervision-register
    predicate: supervised_by
    value: supported
    statement: Traficom (through NCSC-FI) supervises strong electronic identification providers. Providers must notify before starting, attach a conformity assessment report valid for up to two years, and report changes and disturbances. Traficom keeps a public register and can prohibit a service from being offered as strong identification if it does not meet the requirements.
    scope: Finnish providers of strong electronic identification. Other authorities have parallel roles, for example the Data Protection Ombudsman and the Financial Supervisory Authority.
