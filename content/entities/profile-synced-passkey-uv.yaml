    value: supported
    statement: "A synced passkey is a backup-eligible (multi-device) credential; the authenticator signals this with the BE flag, and the BS flag reports whether it is currently backed up."
    scope: What the flags signal; the sync mechanism itself is outside WebAuthn.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
