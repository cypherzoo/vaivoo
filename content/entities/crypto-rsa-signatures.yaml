    note: RS256 and PS256 hash the message with SHA-256; FIPS 186-5 requires an approved hash function.
  - predicate: alternative_to
    object_id: crypto-ecdsa-p256
    claim_id: claim-rsa-fips-approval
    note: Both are FIPS 186-5 approved signature schemes offered as WebAuthn/COSE credential algorithms; ECDSA P-256 gives more security per key bit.
claims:
  - id: claim-rsa-definition
    predicate: definition
    value: supported
    statement: RFC 8017 (PKCS #1 v2.2) defines two RSA signature schemes with appendix, RSASSA-PSS and RSASSA-PKCS1-v1_5. It requires RSASSA-PSS in new applications and includes RSASSA-PKCS1-v1_5 only for compatibility with existing applications, though no attacks on v1_5 are known.
    scope: Scheme definitions in PKCS #1 v2.2; RFC 8017 is an Informational RFC.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc8017
        title: "RFC 8017: PKCS #1: RSA Cryptography Specifications Version 2.2"
        publisher: IETF
        version: RFC 8017 (November 2016, Informational; obsoletes RFC 3447)
        publication_date: "2016-11"
        locator: Section 8 (Signature Scheme with Appendix)
        note: Two signature schemes are specified; PSS is required in new applications for robustness and v1_5 is kept for compatibility, with no attacks known against v1_5.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc8017
        title: "RFC 8017: PKCS #1: RSA Cryptography Specifications Version 2.2"
        publisher: IETF
        version: RFC 8017 (November 2016)
        publication_date: "2016-11"
        locator: Section 8.1 (RSASSA-PSS); Section 8.2 (RSASSA-PKCS1-v1_5)
        note: PSS is probabilistic with a random salt and has a tight security proof relative to RSA inversion; v1_5 security is conjectured, and a gradual move to EMSA-PSS is recommended as a precaution.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-rsa-fips-approval
    predicate: approval_status
    value: supported
    statement: FIPS 186-5 approves both RSASSA-PKCS1-v1_5 and RSASSA-PSS as specified in RFC 8017, with extra constraints, including exactly two prime factors, a public exponent e with 2^16 < e < 2^256, approved hash functions, a PSS salt no longer than the hash output, and strict DigestInfo checks when verifying v1_5 signatures.
    scope: NIST approval for US federal use.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
        title: "FIPS 186-5: Digital Signature Standard (DSS)"
        publisher: NIST
        version: FIPS 186-5 (February 3, 2023)
        publication_date: "2023-02-03"
        locator: Section 5.4 (PKCS #1), items (a)-(h)
        note: Both PKCS #1 signature schemes are approved with added constraints on key generation, hash or XOF choice, prime count, exponent range, RBG, salt length and DigestInfo parsing.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-rsa-key-parameters
    predicate: key_parameters
    value: supported
    statement: FIPS 186-5 specifies RSA signature moduli of even bit length of at least 2048 bits, built from two primes of equal length. Under SP 800-131A Rev. 2, the current final NIST transition guidance, generating signatures with moduli under 2048 bits is disallowed, 2048 bits or more is acceptable, and verification with 1024 to 2047-bit moduli is allowed only for legacy use.
    scope: NIST requirements for US federal use; other regimes may set different minimums.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
        title: "FIPS 186-5: Digital Signature Standard (DSS)"
        publisher: NIST
        version: FIPS 186-5 (February 3, 2023)
        publication_date: "2023-02-03"
        locator: Section 5.1 (RSA Key Pair Generation)
        note: Modulus bit length is an even integer of at least 2048; p and q are each half the length of n; maximum security strength per modulus length is taken from SP 800-57 Part 1.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf
        title: "SP 800-131A Rev. 2: Transitioning the Use of Cryptographic Algorithms and Key Lengths"
        publisher: NIST
        version: SP 800-131A Rev. 2 (March 2019)
        publication_date: "2019-03"
        locator: Section 3, Table 2 (Approval Status of Algorithms Used for Digital Signature Generation and Verification)
        note: "RSA len(n) < 2048 disallowed for generation; len(n) ≥ 2048 acceptable; verification with 1024 ≤ len(n) < 2048 is legacy use; a 2048-bit modulus meets the 112-bit federal minimum."
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-rsa-security-strength
    predicate: security_strength
    value: supported
    statement: NIST treats a 2048-bit RSA modulus as providing 112 bits of security and requires at least 3072 bits for 128-bit security. The strength of an RSA signature is capped by the weaker of the modulus and the hash function.
    scope: Classical (non-quantum) attacks. The NIST table of comparable strengths in SP 800-57 Part 1 (Table 2) could not be read; the values here come from SP 800-131A.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf
        title: "SP 800-131A Rev. 2: Transitioning the Use of Cryptographic Algorithms and Key Lengths"
        publisher: NIST
        version: SP 800-131A Rev. 2 (March 2019)
        publication_date: "2019-03"
        locator: Section 3, text following Table 2 (RSA bullet)
        note: A modulus of 2048 bits or more is needed to meet the 112-bit minimum security strength for federal use.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar3.ipd.pdf
        title: "SP 800-131A Rev. 3 (Initial Public Draft): Transitioning the Use of Cryptographic Algorithms and Key Lengths"
        publisher: NIST
        version: Initial Public Draft (October 21, 2024)
        publication_date: "2024-10-21"
        locator: Section 3, RSA (PKCS #1 v1.5 & PSS) signature generation bullets
        note: 112 to under 128-bit strength corresponds to 2048 ≤ len(n) < 3072; at least 128-bit strength needs len(n) ≥ 3072.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
        title: "FIPS 186-5: Digital Signature Standard (DSS)"
        publisher: NIST
        version: FIPS 186-5 (February 3, 2023)
        publication_date: "2023-02-03"
        locator: Section 5.1, paragraphs on security strength of the RSA digital signature process
        note: Signature strength is no greater than the minimum of the modulus strength and the hash strength.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc8230
        title: "RFC 8230: Using RSA Algorithms with CBOR Object Signing and Encryption (COSE) Messages"
        publisher: IETF
        version: RFC 8230 (September 2017)
        publication_date: "2017-09"
        locator: Section 6.1 (Key Size Security Considerations)
        note: Says a 2048-bit key corresponds roughly to 128-bit symmetric strength, which is higher than NIST's 112-bit rating for the same modulus.
        stance: contradicts
