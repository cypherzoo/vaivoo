        title: OpenID Connect Core 1.0 incorporating errata set 2
        publisher: OpenID Foundation
        version: "Final, incorporating errata set 2, December 15, 2023"
        locator: "§3.1.2.3 Authorization Server Authenticates End-User (#Authenticates)"
        note: Methods the Authorization Server uses to authenticate the End-User, such as password or session cookies, are beyond the scope of the specification.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://openid.net/specs/openid-connect-core-1_0.html
        title: OpenID Connect Core 1.0 incorporating errata set 2
        publisher: OpenID Foundation
        version: "Final, incorporating errata set 2, December 15, 2023"
        locator: "§3 Authentication"
        note: OIDC returns the result of the authentication performed by the server to the client, in an ID Token, so the client can rely on it.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-oidc-id-token-signed
    predicate: id_token_signing_required
    value: conditional
    statement: "ID Tokens must be signed with JWS (optionally signed then encrypted). The unsigned \"none\" algorithm is allowed only when no ID Token is returned from the Authorization Endpoint and the client explicitly requested it at registration. In the Authorization Code Flow, TLS server validation may replace the signature check for tokens received directly from the Token Endpoint."
    scope: ID Token integrity under Core 1.0; required claims iss, sub, aud, exp and iat are listed in §2.
    assumptions:
      - The client has not registered for alg "none".
      - The Relying Party performs ID Token validation as in §3.1.3.7 (issuer, audience, signature or TLS-validated issuer, expiry).
