name: OAuth 2.0
aliases: ["OAuth 2.0 Authorization Framework", "RFC 6749", "OAuth2"]
summary: "An IETF authorization framework (RFC 6749, 2012) that lets an application obtain limited access to an HTTP service on a user's behalf, using access tokens instead of the user's password. It is not an authentication protocol; current security practice is set by RFC 9700 (January 2025)."
layer: [core]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  OAuth 2.0 solves a delegation problem: a user (the resource owner) wants to let an application (the client) use some of their data at another service without handing over their password. The client sends the user to an authorization server, the user approves, and the client receives an access token that it presents to the resource server.

  OAuth 2.0 is about authorization, not authentication. The authorization server must verify who the user is before asking for approval, but RFC 6749 leaves how it does that out of scope. An access token says that a client may access something; it is not, by itself, a statement to the client about who the user is. OpenID Connect adds that missing identity layer on top of OAuth 2.0 with a signed ID Token.

  RFC 6749 defines several ways to obtain tokens (grant types). The Authorization Code grant passes a short-lived code through the browser and exchanges it for tokens over a direct back channel. The Implicit grant returns the access token directly in the browser redirect. The Resource Owner Password Credentials grant has the client collect the user's password.

  More than a decade of deployment exposed weaknesses in several of these options. RFC 9700, the OAuth 2.0 Security Best Current Practice published in January 2025, updates RFC 6749: authorization servers must compare redirect URIs by exact string matching, all clients should use PKCE (public clients must), the Implicit grant should not be used, and the password grant must not be used. A consolidated OAuth 2.1 specification is still an IETF working-group draft.
crypto: |
  Core OAuth 2.0 relies on TLS for confidentiality and server authentication. Access tokens are opaque to the client; their format and any signature are up to the authorization server.

  PKCE (RFC 7636) adds a per-request secret. The client generates a random code_verifier (43 to 128 characters; at least 256 bits of entropy recommended) and sends a code_challenge in the authorization request. With the S256 method the challenge is BASE64URL(SHA-256(code_verifier)). When redeeming the authorization code, the client sends the verifier and the server recomputes the hash; an attacker who intercepted only the code cannot redeem it. S256 is mandatory to implement on servers; the "plain" method exposes the verifier and should not be used.

  When OAuth is used with OpenID Connect, the ID Token is a JSON Web Token signed with JWS (default RS256), which is where public-key signatures enter the picture.
relations:
  - predicate: alternative_to
    object_id: protocol-saml-2
    note: Not a like-for-like alternative. SAML is a federated authentication protocol; OAuth 2.0 alone is authorization. OAuth 2.0 combined with OpenID Connect is the usual alternative to SAML for web SSO.
