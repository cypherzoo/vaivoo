body: |
  ML-DSA is a digital signature scheme built to stay secure even if large quantum computers arrive. A device signs with a private key, and anyone with the public key can verify, just as with ECDSA or Ed25519. The difference is the mathematics underneath: instead of elliptic curves, which a quantum computer could break, ML-DSA relies on hard problems over lattices.

  NIST published ML-DSA as FIPS 204 in August 2024. It comes in three sizes: ML-DSA-44, ML-DSA-65 and ML-DSA-87. Keys and signatures are much bigger than with elliptic curves. The smallest set has a 1,312-byte public key and a 2,420-byte signature, compared with 32 and 64 bytes for Ed25519.

  For authentication, NIST's draft transition plan names ML-DSA as a replacement for quantum-vulnerable signatures such as ECDSA and EdDSA. At the time of writing we could not confirm final COSE identifiers or WebAuthn support for ML-DSA, so passkeys cannot yet be assumed to use it.
crypto: |
  Construction: a Schnorr-like Fiat-Shamir-with-aborts signature over the polynomial ring R_q with q = 8380417. It uses module-structured matrices (k × ℓ) and rejection sampling to avoid leaking the private key (FIPS 204 Sections 3 and 3.3). Security rests on Module Learning With Errors (MLWE) and a nonstandard variant of Module SIS called SelfTargetMSIS (Section 3.2). It uses SHAKE128 and SHAKE256. The pre-hash variant HashML-DSA is separate and domain-separated.

  Parameter sets (FIPS 204 Table 1 and Table 2, sizes in bytes):
  - ML-DSA-44: (k, ℓ) = (4, 4), security category 2; private key 2560, public key 1312, signature 2420.
  - ML-DSA-65: (6, 5), category 3; private key 4032, public key 1952, signature 3309.
  - ML-DSA-87: (8, 7), category 5; private key 4896, public key 2592, signature 4627.
  A category means the scheme is claimed to be at least as hard to break as a reference block cipher or hash. NIST IR 8547 (draft) Table 3 gives security strengths of 128, 192 and 256 bits for these sets. The private key can be stored as just the 32-byte seed ξ.

  Randomness: signing is "hedged" by default. It mixes a fresh 32-byte rnd with precomputed private randomness, so a weak RNG does not leak the key and fault and side-channel attacks are harder. A fully deterministic variant (rnd set to zero) is allowed but discouraged where side channels are a concern (FIPS 204 Sections 3.4 and 3.6.1). Verifiers must reject public keys and signatures of the wrong length (Section 3.6.2).
