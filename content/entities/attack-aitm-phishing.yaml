    value: supported
    statement: "A real-time relay defeats one-time codes, including codes from authenticator apps and hardware tokens. NIST states that OTP authentication is not phishing-resistant because manual entry does not bind the code to the session, so an impostor can relay it to the real verifier."
    scope: Manually entered OTP authenticators (single-factor and multi-factor) as defined in NIST SP 800-63B-4.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
