id: attack-mfa-fatigue
type: Attack
slug: mfa-fatigue
name: MFA fatigue (push bombing)
aliases: [MFA fatigue, Push bombing, Push fatigue, Prompt fatigue, Authentication fatigue, MFA request generation]
summary: "An attacker who already has a user's password triggers sign-in after sign-in so the user's phone fills with approval prompts, hoping the user taps 'approve' by mistake or to make them stop. It works against simple push approval. Making the user type in a number shown on the sign-in screen, rate limits, and phishing-resistant authenticators counter it."
layer: [core]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  Many services use a phone app for the second factor. After the password, the service sends a notification to the app, and the user taps "approve". The approval itself carries no information about which sign-in it belongs to.

  An attacker with the user's password, for example from a data breach or password spraying, can start a sign-in and trigger such a prompt. If the user declines, the attacker tries again, sometimes many times in a short period, or at night. Some users eventually approve, either by accident, to stop the noise, or because they assume one of the prompts is genuine. The attacker is then signed in. Attackers sometimes combine this with a phone call or message pretending to be IT support.

  The weakness is that a single tap does not prove the user is looking at the sign-in they are approving. NIST no longer accepts out-of-band methods that only ask for approval, and it does not accept picking the right number from a short list either. It requires a secret to be transferred between the sign-in screen and the device, for example typing a number shown on the sign-in page into the app. CISA recommends this "number matching" as an interim step when phishing-resistant MFA is not yet possible.

  Number matching stops blind approval, but it does not make push phishing-resistant. A fake site that relays the real sign-in page can show the user the real number. Phishing-resistant authenticators such as security keys and passkeys do not send prompts that a remote attacker can trigger in this way.

  Other measures include limiting how many prompts can be sent, training users to report unexpected prompts, and investigating declined prompts, which can be a sign that the password has been compromised.
