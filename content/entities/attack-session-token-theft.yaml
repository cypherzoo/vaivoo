  - id: claim-session-token-theft-bypasses-authentication
    predicate: defeats_strong_authentication
    value: supported
    statement: "Stealing a bearer session secret bypasses whatever authenticator was used to sign in, including MFA. NIST bases session continuity on possession of the session secret and says cookies are not authenticators. MITRE notes stolen session cookies can bypass some MFA. NIST also warns that access and refresh tokens can stay valid long after the session ends."
    scope: Sessions maintained by bearer secrets; proof-of-possession session mechanisms are treated separately.
    assumptions: []
    claim_type: interpretation
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
