  - id: claim-device-bound-passkey-uv-mfa
    predicate: multi_factor_qualification
    value: conditional
    statement: "With user verification, the device-bound passkey works as a multi-factor cryptographic authenticator under NIST SP 800-63B-4: possession of the key plus a PIN or biometric needed to activate it."
    scope: NIST SP 800-63B-4 classification; other frameworks may differ.
    assumptions:
      - The UV flag is set in the response and the Relying Party inspects it.
      - The activation factor meets NIST Sec. 3.2.10 (activation secrets) or Sec. 3.2.3 (biometrics), and each authentication event requires it.
    claim_type: fact
    status: approved
