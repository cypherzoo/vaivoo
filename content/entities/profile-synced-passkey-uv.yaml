        locator: "§4 Terminology, \"Backup Eligibility / Backup Eligible\" and \"Backup State\"; §6.1.3 Credential Backup State"
        note: Backup-eligible sources are multi-device credentials; BE is permanent, BS may change; BE=1/BS=1 means currently backed up.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.w3.org/TR/webauthn-3/
