body: |
  A hash function turns any amount of data into a short, fixed-size fingerprint. A good cryptographic hash makes it practically impossible to find two inputs with the same fingerprint, or to work backwards from a fingerprint to an input. SHA-2 is the family of hash functions that NIST standardised for this job. Its best-known member, SHA-256, produces a 256-bit (32-byte) fingerprint.

  In authentication, SHA-2 is almost everywhere but rarely visible. Digital signatures (RSA, ECDSA) sign a SHA-2 hash of the data rather than the data itself; the COSE algorithm names RS256, PS256 and ES256 all mean "with SHA-256". One-time password apps may use HMAC with SHA-256 or SHA-512 instead of the original SHA-1. Key derivation and random number generation also commonly use SHA-2.

  Its predecessor, SHA-1, is no longer allowed by NIST for creating new digital signatures, because collisions are much easier to find. NIST's draft rules would also retire the shortest SHA-2 variants (224-bit output) after 2030. SHA-256 and longer remain acceptable for all uses. Quantum computers are not expected to break SHA-2 the way they would break RSA or elliptic curves: NIST considers SHA-256 to meet its post-quantum security categories.
crypto: |
  Construction: all SHA-2 functions are iterative one-way hash functions that process the message in fixed-size blocks (FIPS 180-4 Section 1). SHA-224 and SHA-256 work on 32-bit words and 512-bit blocks; SHA-384, SHA-512, SHA-512/224 and SHA-512/256 work on 64-bit words and 1024-bit blocks.

  Properties (FIPS 180-4 Figure 1; SP 800-107 Rev. 1 Table 1), as message limit / block / word / digest in bits, then collision / preimage strength in bits:
  - SHA-224: < 2^64 / 512 / 32 / 224; 112 / 224
  - SHA-256: < 2^64 / 512 / 32 / 256; 128 / 256
  - SHA-384: < 2^128 / 1024 / 64 / 384; 192 / 384
  - SHA-512: < 2^128 / 1024 / 64 / 512; 256 / 512
  - SHA-512/224: < 2^128 / 1024 / 64 / 224; 112 / 224
  - SHA-512/256: < 2^128 / 1024 / 64 / 256; 128 / 256
  (SHA-1 for comparison: 160-bit digest, collision strength < 80 bits.)

  Which strength matters depends on use. For digital signatures over data that has not been preprocessed, the relevant figure is generally collision resistance (SP 800-107 Rev. 1 Section 5.2). For HMAC, preimage resistance and the key matter more. SP 800-107 Rev. 1 notes that SHA-1 still gives the 112 bits of preimage resistance HMAC needs for 112-bit security, even though it is unfit for signatures.

  Quantum: Grover's algorithm gives roughly a square-root speedup for brute-force search (SP 800-131A Rev. 3 ipd, Appendix A, discussed for AES). NIST IR 8547 (ipd) Table 7 still places SHA-256 in post-quantum category 2 for collisions and category 5 for preimages, and says NIST-approved symmetric primitives with at least 128-bit classical security meet at least category 1.
