        note: Assertions MUST be signed with HTTP POST and MAY be signed with Artifact; artifact resolution must be mutually authenticated, integrity protected and confidential; SP must verify signatures present.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-saml-bearer-replay
    predicate: replay_mitigation
    value: conditional
    statement: "SAML Web SSO assertions are bearer tokens. The profile requires the service provider to check the Recipient URL, the NotOnOrAfter delivery window, the InResponseTo link to its own request and the Audience, and, with the POST binding, to keep a cache of used assertion IDs so bearer assertions are not replayed. Protection depends on the service provider performing these checks."
    scope: Replay and misdirection of assertions at the service provider; does not cover theft of the IdP session or the user's credentials.
    assumptions:
      - The service provider implements all processing rules in §4.1.4.3 and §4.1.4.5.
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://docs.oasis-open.org/security/saml/v2.0/saml-profiles-2.0-os.pdf
        title: Profiles for the OASIS Security Assertion Markup Language (SAML) V2.0
        publisher: OASIS
        version: "OASIS Standard, 15 March 2005 (saml-profiles-2.0-os)"
        publication_date: "2005-03-15"
        locator: "§4.1.4.2 <Response> Usage (bearer SubjectConfirmation, Recipient, NotOnOrAfter, InResponseTo, AudienceRestriction); §4.1.4.3; §4.1.4.5"
        note: Bearer confirmation is mandated with Recipient and NotOnOrAfter; SP must verify these and InResponseTo; with POST the SP must track used IDs for the validity window to prevent replay.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-saml-xml-signature-wrapping
    predicate: xml_signature_wrapping_risk
    value: supported
    statement: "SAML relies on XML Signature, whose verification is considerably more complex than traditional signature formats. Academic analysis showed that XML Signature Wrapping lets an attacker insert forged assertion content while the original signature still verifies; 11 of 14 analysed SAML frameworks were found vulnerable in 2012. Correct implementations must ensure the application processes only the content covered by the verified signature."
    scope: Implementation-level risk in service providers' signature verification and assertion processing; not a flaw in the cryptographic signature algorithm itself. Findings date from 2012 and do not describe current implementations.
    assumptions: []
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.usenix.org/conference/usenixsecurity12/technical-sessions/presentation/somorovsky
        title: "On Breaking SAML: Be Whoever You Want to Be"
        publisher: USENIX Association (21st USENIX Security Symposium)
        version: "Proceedings of USENIX Security 12, pp. 397-412"
        publication_date: "2012-08"
        locator: "Abstract"
        note: XML Signature verification is more complex than PKCS#7-style formats; XSW attacks circumvent integrity protection under a weak adversary model; 11 of 14 analysed SAML frameworks had critical XSW flaws; countermeasures derived from information flow between verification and processing components.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://docs.oasis-open.org/security/saml/Post2.0/sstc-saml-tech-overview-2.0.html
        title: Security Assertion Markup Language (SAML) V2.0 Technical Overview
        publisher: OASIS
        version: "Committee Draft 02, 25 March 2008"
        publication_date: "2008-03-25"
        locator: "§4.6 Security in SAML"
        note: Non-normative overview stating that responses delivered via the browser must be signed with XML Signature for integrity, and that trust typically relies on a pre-existing PKI-based relationship.
        stance: contextualizes
        retrieved_at: 2026-10-03
