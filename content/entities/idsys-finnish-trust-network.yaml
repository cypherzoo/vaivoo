  - id: claim-ftn-assurance-level
    predicate: assurance_level
    value: supported
    statement: Under section 2(1) of Act 617/2009, strong electronic identification must meet eIDAS level of assurance substantial (Article 8(2)(b)) or high (Article 8(2)(c)). Traficom says Finland uses these two levels.
    scope: Legal minimum for every service in the network. The level of each specific means is shown in Traficom's register, which was not analysed.
