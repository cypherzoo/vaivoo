name: RFC 4226 (HOTP)
aliases: [HOTP specification, "RFC 4226", HMAC-based one-time password]
summary: "Informational IETF RFC (December 2005) that defines HOTP, an event-counter one-time password algorithm built on HMAC-SHA-1 with dynamic truncation."
layer: [core, crypto]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  RFC 4226 defines HOTP, the HMAC-based one-time password algorithm. A token and a server share a secret key and a counter. Each new code is computed from the key and the current counter value, and the counter moves forward with every use.

  The RFC covers more than the formula. It also sets out security requirements for deployments, including throttling of failed attempts at the server, a bounded look-ahead window for counter resynchronisation, and how to generate and store shared secrets.

  HOTP is the building block that TOTP (RFC 6238) reuses, with the counter replaced by a time-step count. It was written by members of the Open Authentication initiative and published as an Informational RFC.
