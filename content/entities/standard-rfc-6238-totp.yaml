id: standard-rfc-6238-totp
type: Standard
slug: rfc-6238-totp
name: RFC 6238 (TOTP)
aliases: [TOTP specification, "RFC 6238"]
summary: "Informational IETF RFC (May 2011) that defines the Time-Based One-Time Password algorithm, a time-based variant of HOTP (RFC 4226)."
layer: [core, crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  RFC 6238 takes the HOTP algorithm from RFC 4226 and replaces its event counter with a count of elapsed time steps. The result is the time-based one-time password (TOTP) algorithm that most authenticator apps implement.

  The document defines the algorithm, its default parameters (30-second time step, Unix-epoch start time), guidance on how wide a validation window a verifier should accept, and how to handle clock drift. It also includes a reference implementation and test vectors. How keys are provisioned is out of scope; the RFC points to a separate key-container specification for that.

  It is an Informational RFC, not an Internet Standards Track specification.
