id: method-totp-authentication
type: Method
slug: totp
name: TOTP authentication
aliases: [Time-based one-time password, authenticator-app codes]
summary: Proving possession of a shared secret by entering a short code derived from that secret and the current time.
layer: [core, crypto]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  During enrollment, the service and the user's authenticator (usually an app) share a secret key, often transferred by scanning a QR code. At sign-in, both sides compute a short code from the secret and the current time window; the service accepts the code if it matches.

  The code proves possession of the secret at that moment. It does not by itself bind the code to the website the user is visiting.
crypto: |
  TOTP applies HMAC to a counter derived from the current time (by default 30-second steps), then truncates the result to a short decimal code. It is the time-based variant of HOTP. The shared secret is symmetric: anyone holding a copy, including the server's database, can generate valid codes.
