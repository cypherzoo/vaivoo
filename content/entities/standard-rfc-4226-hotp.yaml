        publisher: IETF
        version: RFC 4226 (December 2005)
        locator: Section 7.3 (Throttling at the Server)
        note: Recommends a low throttling parameter T or increasing delay per failure; delay or lockout MUST span login sessions to stop parallel guessing.
        stance: supports
        retrieved_at: "2026-10-03"
