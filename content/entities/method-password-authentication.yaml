    predicate: composition_and_rotation_rules
    value: not_supported
    statement: "NIST forbids composition rules such as required mixes of character types, and forbids forced periodic password changes. A change must be forced only when there is evidence of compromise. Instead, new passwords must be checked against a blocklist of common, expected or compromised values."
    scope: NIST SP 800-63B-4 password verifier requirements. "not_supported" means NIST does not permit these rules.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
