  - id: claim-sha2-sha1-signature-deprecation
    predicate: deprecation_timeline
    value: supported
    statement: NIST disallows SHA-1 for generating digital signatures, except where NIST protocol-specific guidance explicitly allows it, and permits SHA-1 signature verification only for legacy use. SHA-2 (or SHA-3) is the approved replacement. NIST's draft revision would drop the protocol exception and also retire SHA-1 for non-signature uses after 2030.
    scope: NIST (US federal) approval status; the post-2030 non-signature retirement is in an initial public draft.
