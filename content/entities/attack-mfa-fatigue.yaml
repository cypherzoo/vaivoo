  - id: claim-mfa-fatigue-number-matching
    predicate: mitigation
    value: conditional
    statement: "Number matching mitigates MFA fatigue: the user must type a number shown on the sign-in screen into the app, so they cannot approve a sign-in they cannot see, and repeated prompts stop being useful. CISA recommends it as an interim measure. It does not stop a phishing relay, which can show the victim the real number."
    scope: Push-based MFA with number entry; CISA rates it below phishing-resistant MFA.
    assumptions:
      - "The user types the number shown on the sign-in screen into the app; choosing from a short list does not meet NIST's requirement."
      - "The attacker is not relaying the real sign-in page to the victim. If they are, the attack becomes AiTM phishing (see attack-aitm-phishing)."
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.cisa.gov/sites/default/files/publications/fact-sheet-implement-number-matching-in-mfa-applications-508c.pdf
        title: Implementing Number Matching in MFA Applications (fact sheet)
        publisher: US Cybersecurity and Infrastructure Security Agency (CISA)
        publication_date: "2022-10"
        locator: "Sections 'Overview' and 'Mitigation'"
        note: Number matching forces the user to enter numbers from the login screen, so requests cannot be approved without seeing it and prompt spam is ineffective; recommended as an interim mitigation weaker than phishing-resistant MFA.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf
        title: Implementing Phishing-Resistant MFA (fact sheet)
        publisher: US Cybersecurity and Infrastructure Security Agency (CISA)
        publication_date: "2022-10"
        locator: "Table 1: MFA Forms, Strongest to Weakest, row 'App-based authentication' (includes push with number matching)"
        note: Resistant to push bombing but vulnerable to phishing.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.3 Out-of-Band Devices (#out-of-band), Note following Fig. 2"
        note: Choosing from a presented list of secrets does not meet the transfer requirement.
        stance: contextualizes
