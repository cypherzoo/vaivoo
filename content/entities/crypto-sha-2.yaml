    statement: NIST gives SHA-256 128 bits of collision resistance and 256 bits of preimage resistance, SHA-384 192 and 384 bits, and SHA-512 256 and 512 bits. SHA-224 and SHA-512/224 give 112 bits of collision resistance. For digital signatures, the relevant strength is generally the collision resistance.
    scope: Classical security strengths. SP 800-107 Rev. 1 is still listed as final, but NIST has announced that it will be withdrawn.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
