        note: "Collision / preimage strengths: SHA-1 < 80 / 160; SHA-224 112 / 224; SHA-256 128 / 256; SHA-384 192 / 384; SHA-512 256 / 512; SHA-512/224 112 / 224; SHA-512/256 128 / 256. Signature strength is generally the collision strength."
        stance: supports
        retrieved_at: "2026-10-03"
