    value: supported
    statement: Under SP 800-131A Rev. 2, the current final NIST transition guidance, all six SHA-2 functions are acceptable for all hash function applications. NIST's October 2024 draft revision would deprecate the 224-bit variants (SHA-224, SHA-512/224) for applying protection through 2030 and disallow them afterwards, leaving SHA-256, SHA-384, SHA-512 and SHA-512/256 acceptable for all uses.
    scope: NIST approval for US federal use; the 224-bit retirement is from an initial public draft.
    assumptions: []
    claim_type: fact
    status: proposed
