name: SAML 2.0 Web Browser SSO
aliases: ["SAML 2.0", "SAML", "Security Assertion Markup Language 2.0", "SAML V2.0 Web Browser SSO Profile"]
summary: "An OASIS standard (March 2005) for federated single sign-on. A service provider sends the user's browser to an identity provider, which authenticates the user and returns a signed XML assertion saying who the user is and how and when they were authenticated."
layer: [core]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  SAML (Security Assertion Markup Language) 2.0 is a set of OASIS specifications for exchanging security statements, called assertions, between organisations. Its most common use is web single sign-on: a user who visits a service provider (SP) is sent to an identity provider (IdP), signs in there, and comes back with an assertion that the SP accepts instead of running its own login.

  The Web Browser SSO Profile describes this flow. The SP issues an AuthnRequest, the browser carries it to the IdP, the IdP identifies the user, and the IdP returns a Response containing at least one assertion with an authentication statement. The Response travels back through the browser, usually as an HTML form POST, or is fetched by the SP directly using an artifact.

  SAML does not say how the IdP authenticates the user. The profile leaves that "outside the scope" of SAML: the IdP may ask for a password, a security key, a national eID, or reuse an existing session. What SAML carries is the result, including an AuthnContext element that names the kind of authentication used, so the SP can decide whether it is strong enough.

  Because the assertion passes through the user's browser, the SP must check it carefully: the signature, the intended recipient URL, the audience, the time window, the link to its own request, and that the same assertion has not been used before. Weak handling of XML signatures has historically been the biggest source of SAML vulnerabilities, in particular XML Signature Wrapping, where an attacker moves signed content around so the signature still verifies but the application reads attacker-supplied data.
crypto: |
  Integrity and origin of SAML messages rest on XML Signature (XML-DSig). An IdP signs the assertion (or the whole Response) with its private key, and the SP verifies it with the IdP's public key, normally obtained from SAML metadata or another pre-established trust relationship. A PKI is recommended but not mandated.

  When the Response is delivered through the browser with the HTTP POST binding, the assertions must be signed. With the HTTP Artifact binding, the SP retrieves the message over a back channel that must be mutually authenticated, integrity protected and confidential, so signing is optional there. XML Encryption can additionally hide assertion contents from the browser.

  XML-DSig verification is complex: the verifier resolves references, applies transforms and canonicalisation, and only then checks the signature value. If the code that verifies the signature and the code that reads the assertion look at different elements, an attacker can wrap a forged assertion around a genuinely signed one. Robust implementations process only the exact element that was covered by the verified signature.
relations:
  - predicate: alternative_to
    object_id: protocol-openid-connect
    note: Both are federation protocols that convey an identity provider's authentication result to a relying party; OpenID Connect uses JSON/JWS tokens on top of OAuth 2.0, SAML uses signed XML assertions.
