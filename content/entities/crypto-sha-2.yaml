  - id: claim-sha2-quantum-impact
    predicate: quantum_resistance
    value: supported
    statement: NIST considers SHA-2 far less exposed to known quantum attacks than RSA or elliptic-curve cryptography. Its draft transition report puts SHA-256 in post-quantum security category 2 for collision resistance and category 5 for preimage resistance, and proposes no quantum-driven retirement of SHA-256 or larger. Grover's algorithm gives at most a square-root speedup on brute-force search, and NIST expects it to help attackers less than that in practice.
    scope: NIST's current assessment; the main sources are initial public drafts. That Grover's algorithm halves preimage security in bits is a common reading of the square-root speedup, not a figure NIST states for hashes in these documents.
    assumptions: []
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
        title: "NIST IR 8547 (Initial Public Draft): Transition to Post-Quantum Cryptography Standards"
        publisher: NIST
        version: Initial Public Draft (November 12, 2024)
        publication_date: "2024-11-12"
        locator: Section 4.1.3 (Symmetric Cryptography), Table 7 (Hash functions and XOFs); Table 1 (Post-Quantum Security Categories)
        note: Symmetric standards including hash functions are significantly less vulnerable to known quantum attacks; approved primitives with at least 128-bit classical security meet at least category 1; SHA-256 is category 2 (collision) and category 5 (preimage); only 112-bit primitives face 2030 disallowance.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar3.ipd.pdf
        title: "SP 800-131A Rev. 3 (Initial Public Draft): Transitioning the Use of Cryptographic Algorithms and Key Lengths"
        publisher: NIST
        version: Initial Public Draft (October 21, 2024)
        publication_date: "2024-10-21"
        locator: Appendix A (Continued Use of AES)
        note: Grover gives roughly a square-root speedup for brute-force search, but its serial nature limits the real-world gain; NIST will issue guidance if hash functions or other symmetric primitives ever need a quantum-driven transition.
        stance: contextualizes
        retrieved_at: "2026-10-03"
