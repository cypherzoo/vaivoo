id: crypto-ecdsa-p256
type: CryptographicPrimitive
slug: ecdsa-p256
name: ECDSA with P-256
aliases: ["ES256 (COSE/JOSE)", "ESP256 (COSE)", "ECDSA P-256", "secp256r1", "prime256v1", "NIST P-256"]
summary: A digital signature scheme that uses elliptic curves (ECDSA) on the NIST curve P-256. It is approved in FIPS 186-5, gives about 128-bit classical security, and is the most common passkey signature algorithm (COSE ES256).
layer: [crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  ECDSA with P-256 lets a device prove it holds a private key by signing data. Anyone with the matching public key can check the signature. In WebAuthn and passkeys, the authenticator signs the server's challenge with this kind of key, and the server checks the signature with the public key it stored at registration.

  P-256 is one specific elliptic curve published by NIST. The same curve also goes by secp256r1 (SECG) and prime256v1 (ANSI X9.62). In COSE, the format that WebAuthn uses, this combination has long been labelled ES256 (algorithm -7).

  ECDSA has a well-known weakness: each signature needs a fresh secret random number. If that number is repeated or predictable, the private key can leak. Like all elliptic-curve schemes, ECDSA could be broken by a large enough quantum computer. NIST has proposed a schedule for moving away from it.
crypto: |
  Curve: P-256 is a short Weierstrass curve over the prime field GF(p) with p = 2^256 − 2^224 + 2^192 + 2^96 − 1 and cofactor h = 1 (SP 800-186 Section 3.2.1.3). FIPS 186-5 Table 1 maps a 256–383-bit group order n to a security strength of about len(n)/2, and at least 128 bits. SP 800-186 Table 1 lists P-256 at 128 bits.

  Signature: (r, s), two integers modulo n. COSE encodes them as fixed-length big-endian byte strings concatenated, I2OSP(r, 32) || I2OSP(s, 32), so 64 bytes for P-256 (RFC 9053 Section 2.1). Other containers such as X.509 use different encodings. RFC 9053 suggests pairing SHA-256 with P-256.

  Nonce: FIPS 186-5 Section 6.3 requires a new secret per-message number k for every signature, protected like the private key. It can be generated randomly (Section 6.3.1) or deterministically from the message and private key (deterministic ECDSA, RFC 6979, Section 6.3.2). RFC 9053 notes that biased k can be attacked and that colliding k values leak keys, and recommends deterministic ECDSA. FIPS 186-5 warns that deterministic schemes still need protection against side-channel and fault attacks.

  Quantum: NIST IR 8547 (initial public draft) states that ECDSA is vulnerable to Shor's algorithm on a cryptographically relevant quantum computer.
