body: |
  Regulation (EU) 2024/1183 of 11 April 2024 amends the original eIDAS Regulation, (EU) No 910/2014, to set up the European Digital Identity Framework. It was published in the Official Journal on 30 April 2024 and entered into force on 20 May 2024. It is an amending act: the rules apply as part of eIDAS as amended.

  The main new element is the European Digital Identity Wallet (see the EUDI Wallet entry). Each Member State must provide at least one wallet within 24 months after the relevant implementing acts enter into force. A wallet can be provided by the state, under a state mandate, or independently but recognised by the state. Issuing, using and revoking a wallet must be free for natural persons, and the source code of the wallet's application software must be open source, with limited exceptions.

  The Regulation also says who must accept the wallet. Public sector bodies that require electronic identification for an online service must accept it. Larger private relying parties that are required to use strong user authentication, for example in banking, energy, transport, health or telecoms, must accept it within 36 months of the implementing acts, but only when the user chooses to use it. Micro and small enterprises are exempt. Very large online platforms that require login must also accept it at the user's request.

  eIDAS keeps three levels of assurance: low, substantial and high. The detailed criteria are in Commission Implementing Regulation (EU) 2015/1502. The wallet itself must meet the requirements for level high.

  Norway, Iceland and Liechtenstein apply EU internal-market law only after it is added to the EEA Agreement. At retrieval, EFTA's EEA-Lex lists 2024/1183 as under scrutiny for incorporation, with no Joint Committee Decision yet.
