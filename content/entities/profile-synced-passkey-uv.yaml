  - id: claim-synced-passkey-uv-attestation
    predicate: attestation_available
    value: conditional
    statement: "Attestation is optional in WebAuthn and the default conveyance is \"none\"; NIST notes attestations are of limited availability in consumer syncable authenticators. A Relying Party should not assume it will receive one."
    scope: Registration-time attestation for synced passkeys in public-facing deployments.
    assumptions:
      - The Relying Party requests a conveyance other than "none" (indirect, direct or enterprise).
      - The passkey provider actually produces a verifiable attestation statement; support varies and is not documented here.
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§5.4.7 Attestation Conveyance Preference Enumeration (enum AttestationConveyancePreference), value \"none\""
        note: "\"none\" is the default; the client replaces non-self attestation statements with a None attestation statement."
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/syncable/
        title: "NIST SP 800-63B-4: Appendix B. Syncable Authenticators"
