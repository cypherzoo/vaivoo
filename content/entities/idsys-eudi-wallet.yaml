  - id: claim-eudi-wallet-credential-formats
    predicate: credential_formats
    value: supported
    statement: Wallet Units must support the ISO/IEC 18013-5 (generalised in ISO/IEC 23220-2) mdoc format and SD-JWT VC. Support for the W3C Verifiable Credentials Data Model v2.0 is optional and only for non-qualified EAAs.
    scope: ARF v3.0.0 (informative). Binding requirements sit in the implementing acts.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eudi.dev/latest/main/05-data-model-and-data-exchange-protocols/
        title: 5 Data model and data exchange protocols - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Section '5.4.1 Overview' (table and following paragraphs)"
        note: ISO 18013-5/23220-2 (CBOR) and SD-JWT VC mandatory, both with salted-hash selective disclosure; W3C VCDM v2.0 optional, non-qualified EAAs only.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-eudi-wallet-protocols
    predicate: exchange_protocols
    value: supported
    statement: PIDs and attestations are issued with OpenID4VCI, profiled by HAIP. Remote presentation uses OpenID4VP (with HAIP) or ISO/IEC 18013-7, over redirects with custom URI schemes or the W3C Digital Credentials API. Proximity presentation uses ISO/IEC 18013-5.
    scope: ARF v3.0.0. PID Providers may agree other issuance protocols bilaterally with the Wallet Provider if these meet the implementing acts.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eudi.dev/latest/main/05-data-model-and-data-exchange-protocols/
        title: 5 Data model and data exchange protocols - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Sections '5.7.1 Introduction' and '5.8 Protocols and transmission mechanisms for attestation issuance'"
        note: ISO 18013-5 for proximity; OpenID4VP or ISO 18013-7 remote via custom URI or Digital Credentials API; OpenID4VCI with HAIP for issuance.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-eudi-wallet-pseudonyms
    predicate: selective_disclosure_and_pseudonyms
    value: supported
    statement: Wallets support selective disclosure of attributes with user approval. Under Article 5a(4)(b) they must generate pseudonyms and store them encrypted locally. CIR 2024/2979 Article 14(2) requires a pseudonym specific to each relying party on request. The ARF names WebAuthn passkeys as one implementation option.
    scope: Pseudonymous authentication (ARF use case A) is required; use cases B to D still need further specification.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eudi.dev/latest/main/02-eudi-wallet-functionalities/
        title: 2 EUDI Wallet functionalities - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Sections '2.2 Identification and authentication', '2.5.1 Overview' and '2.5.6 Use case support'"
        note: Selective disclosure with user approval; Article 5a(4)(b) pseudonyms; Article 5b(9) relying parties may not refuse pseudonyms; CIR 2024/2979 Art 14(2) relying-party-specific pseudonyms.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://eudi.dev/latest/main/04-high-level-architecture/
        title: 4 High-level architecture - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0
        locator: "Section '4.7.2.1 Introduction to Passkeys'"
        note: One option for verifiable pseudonyms is for Wallet Units to act as a WebAuthn authenticator (passkeys).
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-eudi-wallet-rp-registration
    predicate: relying_party_registration
    value: supported
    statement: Relying parties register with a Registrar in the Member State where they are established, receive an EU-wide unique identifier, and get access certificates (X.509) and registration certificates (JWT). Wallets use these to identify the relying party to the user.
    scope: Per ARF v3.0.0 and CIR 2025/848. The ARF notes that the wallet's duty to validate registration certificates starts 24 months after an amendment to CIR 2024/2982 enters into force.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eudi.dev/latest/main/03-roles-within-the-eudi-wallet-ecosystem/
        title: 3 Roles within the EUDI Wallet ecosystem - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Sections '3.11.1 Relying Parties' and '3.19 Providers of registration certificates'"
        note: Relying parties register at a national Registrar, get EU-wide unique identifier, access and registration certificates; registration certificate is a JWT bound to X.509 access certificates.
        stance: supports
        retrieved_at: 2026-10-03
