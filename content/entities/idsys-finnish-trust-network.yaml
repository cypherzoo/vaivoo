        publisher: Finlex (Ministry of Justice, Finland)
        version: Consolidated text incl. amendment 811/2026
        locator: "Section 12 c (29.3.2019/412)"
        note: (Finnish) Access compensation is at most 3 cents per relayed event, covers all identity data and interfaces, no other fee is allowed, and Traficom assesses the level yearly.
        stance: supports
        retrieved_at: 2026-10-03
