  - id: claim-rfc6238-defines-totp
    predicate: defines
    value: supported
    statement: "RFC 6238 defines TOTP = HOTP(K, T), where T = floor((current Unix time - T0) / X), and requires HOTP (RFC 4226) as the core building block. Implementations must handle values of T larger than 32 bits for dates beyond 2038."
    scope: Algorithm definition.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: Section 4.2 (Description); Section 3 (Algorithm Requirements), R3
        note: Defines TOTP as HOTP(K, T) with T counted in time steps from T0; requires support for T beyond 32 bits after 2038; R3 mandates HOTP as building block.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-rfc6238-key-parameters
    predicate: key_parameters
    value: supported
    statement: "Default parameters are time step X = 30 seconds and T0 = 0 (the Unix epoch). The hash may be HMAC-SHA-1, HMAC-SHA-256 or HMAC-SHA-512. Verifiers are advised to allow at most one time step for network delay."
    scope: Defaults and recommendations; deployments may differ.
