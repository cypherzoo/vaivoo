  - id: claim-ftn-pki-citizen-certificate
    predicate: uses_pki_certificates
    value: conditional
    statement: "Some network means are certificate-based. DVV's citizen certificate is stored on the ID-card chip and is used for identification and electronic signatures; DVV states that its certificates meet eIDAS and Act 617/2009 requirements at a high standard. The technical design of bank-code means and mobile certificates was not reviewed."
    scope: Applies to the DVV citizen certificate and other certificate-based means. Mobile certificates are certificate-based by name, but their technical design was not reviewed.
    assumptions:
      - Only means explicitly described as certificate-based are counted; bank online codes are not assumed to use user certificates.
    claim_type: fact
