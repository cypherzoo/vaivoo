  - id: claim-sim-swap-not-applicable-other-authenticators
    predicate: defeats_app_and_cryptographic_authenticators
    value: not_supported
    statement: "SIM swap does not directly defeat authenticator-app codes, push approval, FIDO/WebAuthn or PKI-based authentication, because none of these depend on the phone number. CISA marks SIM swap as not applicable to all of them."
    scope: "Direct attack on the authenticator. If the service lets the phone number recover or replace these authenticators, the account remains exposed through recovery (see claim-sim-swap-account-recovery)."
