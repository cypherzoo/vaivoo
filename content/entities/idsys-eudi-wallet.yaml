id: idsys-eudi-wallet
type: IdentitySystem
slug: eudi-wallet
name: European Digital Identity Wallet (EUDI Wallet)
aliases: [EUDI Wallet, EU Digital Identity Wallet, EUDIW]
summary: The EU-wide digital identity wallet set up by the amended eIDAS Regulation. Each Member State must provide at least one wallet for identifying, authenticating, sharing attributes and signing, with person identification data at level of assurance high.
layer: [nordic-eu, core]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  The European Digital Identity Wallet is not a single app. It is a legal and technical framework under which each EU Member State provides at least one wallet, built to common specifications. The legal basis is Regulation (EU) No 910/2014 (eIDAS) as amended by Regulation (EU) 2024/1183 of 11 April 2024, which the Commission calls the European Digital Identity Regulation. The Commission has adopted implementing regulations covering, among other things, PID and attestations, integrity and core functions, notifications, certification, protocols and interfaces, and registration of relying parties. Some of these were amended again in 2026.

  A user's wallet holds Person Identification Data (PID) from a PID Provider, plus electronic attestations of attributes (qualified or not) from other issuers. The user can present selected attributes to relying parties remotely or in person, create qualified electronic signatures, and authenticate with pseudonyms when the service does not need to know who they are. The PID is issued and managed at level of assurance high. Using a wallet is not mandatory for citizens.

  Relying parties must register with a Registrar in their Member State. They receive access certificates and registration certificates, which the wallet uses to show the user who is asking and what that relying party is registered to request.

  The common technical baseline is the Architecture and Reference Framework (ARF), published by the Commission. The ARF is informative: only the Regulation and its implementing and delegated acts are binding. The latest ARF release at retrieval was v3.0.0 (July 2026). This entry does not cover the Regulation as a separate legal entity. It also does not cover rollout in individual Member States or EEA incorporation, for which no primary source was retrieved.
crypto: |
  In ARF v3.0.0, the PID private keys must be managed in a Wallet Secure Cryptographic Device (WSCD). This is a tamper-resistant device assessed at assurance level high, reached through a Wallet Secure Cryptographic Application (WSCA). The WSCD can be remote (for example an HSM), local external (a smart card), local internal (SIM, eSIM or embedded secure element) or local native (provided by the device operating system). Ordinary keystores such as a TEE or secure enclave may hold non-critical keys, but not PID keys. User access to the WSCA/WSCD always needs two user authentication mechanisms.

  Both mandatory credential formats, ISO/IEC 18013-5 mdoc and SD-JWT VC, achieve selective disclosure with salted hashes embedded in the issuer-signed credential. Device binding ties a presentation to a key held by the wallet. For payments and signing, transactional data is signed as part of the device-binding signature. Registration certificates are JWTs, while access certificates are X.509. The ARF pages reviewed do not fix specific signature algorithms or curves, so this entry treats them as not publicly specified here.
relations:
  - predicate: uses_protocol
    object_id: standard-webauthn
    claim_id: claim-eudi-wallet-pseudonyms
    note: Optional. The ARF names WebAuthn and passkeys as one way to implement verifiable pseudonyms; other mechanisms are allowed.
claims:
  - id: claim-eudi-wallet-legal-basis
    predicate: legal_basis
    value: supported
    statement: The EUDI Wallet framework is set up by Regulation (EU) No 910/2014 as amended by Regulation (EU) 2024/1183 of 11 April 2024. The details are filled in by Commission implementing regulations, including CIR (EU) 2024/2977, 2024/2979, 2024/2980, 2024/2981 and 2024/2982 of 28 November 2024 and CIR (EU) 2025/848 on relying-party registration.
    scope: Core legal acts for the wallet. EUR-Lex metadata gives 2024-05-20 as the first entry into force of 2024/1183, but the body text could not be retrieved. Amending acts 2026/1730, 2026/1731 and 2026/1735 are noted but not analysed.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eur-lex.europa.eu/eli/reg/2024/1183/oj/eng
        title: Regulation (EU) 2024/1183 of the European Parliament and of the Council of 11 April 2024 amending Regulation (EU) No 910/2014 as regards establishing the European Digital Identity Framework
        publisher: Publications Office of the EU (EUR-Lex)
        locator: Page metadata (document title; eli:date_document; eli:first_date_entry_in_force)
        note: Title confirms the act amends 910/2014 to establish the European Digital Identity Framework; document date 2024-04-11, first entry into force 2024-05-20. Body text not rendered.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://eudi.dev/latest/main/01-introduction/
        title: 1 Introduction - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Sections '1.2 Legal context' and '1.6 Change Log'"
        note: Framework established by 910/2014 as amended by 2024/1183; lists CIRs 2024/2977, 2979, 2980, 2982 (28 Nov 2024) and 2025/848 (6 May 2025).
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://ec.europa.eu/digital-building-blocks/sites/spaces/EUDIGITALIDENTITYWALLET/pages/915931811/The+European+Digital+Identity+Regulation
        title: The European Digital Identity Regulation - EU Digital Identity Wallet
        publisher: European Commission
        version: Last updated 2026-07-22
        locator: "Section 'Overview of all the EUDI Wallets Implementing Acts'"
        note: Lists adopted implementing acts by article basis (e.g. Article 5a(23) protocols, PID, integrity; 5b(11) RP registration; 5c(6) certification), some amended by 2026/1731.
        stance: supports
        retrieved_at: 2026-10-03
