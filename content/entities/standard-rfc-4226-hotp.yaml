  - id: claim-rfc4226-defines-hotp
    predicate: defines
    value: supported
    statement: "HOTP(K, C) = Truncate(HMAC-SHA-1(K, C)), where C is an 8-byte counter. Dynamic truncation takes 4 bytes at an offset given by the low 4 bits of the last MAC byte, keeps 31 bits, and reduces modulo 10^Digit."
    scope: Algorithm definition.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc4226
        title: "RFC 4226: HOTP: An HMAC-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 4226 (December 2005)
        locator: Section 5.2 (Description); Section 5.3 (Generating an HOTP Value)
        note: HOTP uses an increasing counter and static symmetric key with HMAC-SHA-1; dynamic truncation extracts a 31-bit value then reduces it modulo 10^Digit.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc4226
        title: "RFC 4226: HOTP: An HMAC-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 4226 (December 2005)
        locator: Section 5.1 (Notation and Symbols)
        note: C is an 8-byte counter that must be synchronized between client and server; K is a unique shared secret per generator.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-rfc4226-min-digits-and-secret-length
    predicate: key_parameters
    value: supported
    statement: Implementations MUST produce at least a 6-digit code (7 or more digits SHOULD be considered for higher security). The shared secret MUST be at least 128 bits, and 160 bits is RECOMMENDED.
    scope: Normative parameters of RFC 4226.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
