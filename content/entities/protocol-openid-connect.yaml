  - id: claim-oidc-nonce-replay
    predicate: replay_mitigation
    value: supported
    statement: "The nonce binds a client session to an ID Token and mitigates replay: the OP must echo the request nonce in the ID Token, and the client must check it matches. It is required in the Implicit Flow."
    scope: Token replay and injection at the Relying Party; the precise replay-detection method is client-specific.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
