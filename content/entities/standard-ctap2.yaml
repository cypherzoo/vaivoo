name: Client to Authenticator Protocol (CTAP)
aliases: ["CTAP", "CTAP2", "CTAP 2.3", "FIDO2 CTAP", "FIDO Client to Authenticator Protocol"]
summary: "FIDO Alliance specification for how a computer or phone (the client platform) talks to an external authenticator such as a security key or another phone, over USB, NFC, Bluetooth or the hybrid transport. It is the device-side half of FIDO2; WebAuthn is the web-side half. The latest Proposed Standard is version 2.3 (26 February 2026)."
layer: [core, crypto]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  When a website uses WebAuthn, the browser often needs to reach an authenticator that is not built into the device: a USB security key, an NFC card, or a phone. CTAP is the protocol for that conversation. It defines the commands (such as authenticatorMakeCredential to create a credential and authenticatorGetAssertion to sign in), how they are encoded (CBOR for CTAP2), and how they travel over each transport.

  The specification covers two protocol generations. CTAP1/U2F is the older APDU-style protocol from the U2F specifications. CTAP2 is the current one, and CTAP2 authenticators are also called FIDO2 or WebAuthn authenticators. Both share the USB HID, NFC and Bluetooth Low Energy transports. A hybrid transport lets a phone act as the authenticator for a nearby computer: the computer shows a QR code, and Bluetooth advertisements prove that the phone is physically close while messages travel through a tunnel service or a local link.

  Many security keys have no keyboard or fingerprint sensor. CTAP lets the user type a PIN on the computer instead (clientPIN). The PIN is never sent in the clear: the platform and authenticator first agree on a shared key, and the authenticator then hands back a short-lived pinUvAuthToken that the platform uses to authorise commands. Authenticators with built-in user verification, such as a fingerprint sensor, can issue the same kind of token. The authenticator limits wrong PIN attempts and locks after too many.

  Credentials can be discoverable (historically called resident keys): the authenticator stores enough state to find the right credential given only the website's RP ID, which enables sign-in without typing a username. Non-discoverable credentials need the website to send the credential ID.
crypto: |
  CTAP itself does not define the credential signature; that is the WebAuthn/COSE key pair created on the authenticator. CTAP's own cryptography protects the PIN and the user-verification token between platform and authenticator.

  PIN/UV Auth Protocol One: the authenticator holds an ephemeral P-256 key-agreement key. Platform and authenticator perform ECDH on P-256 and derive the shared secret as SHA-256 of the x-coordinate. Data such as the PIN hash is encrypted with AES-256-CBC using an all-zero IV, and commands are authenticated with HMAC-SHA-256 truncated to 16 bytes. pinUvAuthTokens are 16 or 32 random bytes.

  PIN/UV Auth Protocol Two, intended to help FIPS certification: the same ECDH on P-256, but the shared secret is two separate HKDF-SHA-256 outputs, one labelled as an HMAC key and one as an AES key. Encryption uses AES-256-CBC with a random 16-byte IV, authentication uses full HMAC-SHA-256, and pinUvAuthTokens are always 32 bytes.

  The hybrid transport uses a QR code carrying a P-256 public key and a shared secret: the public key authenticates the client platform, and knowledge of the secret authenticates the connecting authenticator.
