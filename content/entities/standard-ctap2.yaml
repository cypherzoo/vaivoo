  - id: claim-ctap-clientpin-limits
    predicate: pin_retry_limit
    value: supported
    statement: "For clientPIN, authenticators must enforce a minimum PIN length of 4 code points (they may require more) and allow no more than 8 PIN retries (a correct PIN resets the counter); when the PIN retry counter reaches zero, both clientPIN and built-in user verification are disabled until the authenticator is reset. PINs must be stored with security at least equal to that of private keys. clientPIN can provide user verification but does not by itself assert user presence."
    scope: Baseline requirements in CTAP 2.3; authenticators may set stricter limits. Whether a given authenticator meets them is a certification question not assessed here.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://fidoalliance.org/specs/fido-v2.3-ps-20260226/fido-client-to-authenticator-protocol-v2.3-ps-20260226.html
        title: Client to Authenticator Protocol (CTAP)
        publisher: FIDO Alliance
        version: "Proposed Standard, February 26, 2026 (v2.3)"
        publication_date: "2026-02-26"
        locator: "§6.5.1 PIN Composition Requirements; §6.5.2.3 PIN-Entry and User Verification Retries Counters"
        note: Minimum 4 code points, max 63 bytes; PIN storage as secure as private keys; no more than 8 PIN retries; at zero both ClientPin and built-in UV are disabled until reset.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://fidoalliance.org/specs/fido-v2.3-ps-20260226/fido-client-to-authenticator-protocol-v2.3-ps-20260226.html
        title: Client to Authenticator Protocol (CTAP)
        publisher: FIDO Alliance
        version: "Proposed Standard, February 26, 2026 (v2.3)"
        publication_date: "2026-02-26"
        locator: "§5 Terminology, \"Built-in User Verification method\" and \"Evidence of user interaction\""
        note: clientPin is not a built-in UV method; platform-mediated interactions such as clientPin may provide UV but are not considered to assert user presence (NFC tap is a special case).
        stance: contextualizes
        retrieved_at: 2026-10-03
  - id: claim-ctap-discoverable-credentials
    predicate: key_storage_location
    value: conditional
    statement: "A discoverable credential (historically called a resident key) is one the authenticator can find given only the RP ID, without the website supplying a credential ID; it always requires client-side stored state, and is created only when the rk option is true. Non-discoverable (server-side) credentials need the Relying Party to send the credential ID in allowList. CTAP notes that \"resident\" wrongly conflated discoverability with stateful storage."
    scope: Credential discoverability under CTAP 2.3 §6.1.3. Where the private key physically resides for non-discoverable credentials is authenticator-specific.
    assumptions: []
