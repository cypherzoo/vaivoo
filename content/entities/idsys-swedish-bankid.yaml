  - id: claim-swedish-bankid-pki
    predicate: uses_pki_certificates
    value: supported
    statement: BankID uses X.509 PKI. Relying parties hold organisation certificates for API access. Signatures returned to relying parties include the user's certificate, intermediate CA certificates and an OCSP response, which can be verified up to the operator's self-signed root.
    scope: Auth and sign signatures per developer documentation. Algorithms and key storage for user keys are not stated in the pages reviewed.
    assumptions: []
    claim_type: vendor_claim
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://developers.bankid.com/how-to-guides/verifying-signatures
        title: Verifying signatures - BankID Developers
        publisher: Finansiell ID-Teknik BID AB (developers.bankid.com)
        locator: "Section 'Auth and sign' (list 'To verify a signature' and 'How to verify')"
        note: The service already verifies signatures and certificates. For re-verification it lists the user and intermediate CA certificates in the signature, the OCSP response, and a self-signed root available on request; steps include checking the OCSP nonce against the signature digest.
