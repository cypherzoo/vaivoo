    statement: "For natural persons, issuance, use and revocation of the wallet must be free of charge. Qualified electronic signatures must also be offered through the wallet by default and free of charge, although Member States may limit free QES use to non-professional purposes."
    scope: "Free-of-charge rules in Article 5a(13) and Article 5a(5)(g) of Regulation (EU) No 910/2014 as amended by Regulation (EU) 2024/1183; national implementation may add detail."
    assumptions:
