id: method-password-authentication
type: Method
slug: password
name: Password authentication
aliases: [Password, Passphrase, Memorized secret, Centrally verified password]
summary: "Signing in by typing a secret the user chose and remembers. The service checks it against a salted, slow hash. It is a single knowledge factor, it is not phishing-resistant, and on its own it reaches only NIST AAL1."
layer: [core, crypto]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  The user picks a secret (a password, passphrase or PIN) when the account is created. At sign-in they type it, and it is sent over a protected connection to the service, which checks it against what it stored at enrollment.

  Current NIST guidance focuses on length and screening instead of complexity rules. Passwords used alone must be at least 15 characters (8 if they are only one part of multi-factor sign-in). New passwords are checked against a list of common or breached values. Services may not demand mixes of character types, and may not force regular changes unless there is evidence of compromise.

  The same secret is sent every time, so anyone who sees it once can reuse it. A convincing fake site can simply ask for it. Length does not help against phishing, keylogging or social engineering. The service must also limit failed guesses and store passwords so that a stolen database is expensive to crack.
crypto: |
  The verifier stores a password hash, never the password itself. NIST requires a salt of at least 32 bits and a password hashing scheme that takes the password, the salt and a cost factor. The cost factor makes each guess expensive for an attacker who steals the hash file. It should be as high as practical and raised over time. NIST recommends an approved scheme from the latest revision of SP 800-132.

  NIST also recommends an extra keyed hashing or encryption step with a secret key known only to the verifier, stored apart from the hashes and ideally inside a hardware security module or similar hardware. If that key stays secret, brute-forcing a stolen hash file becomes impractical.

  None of this protects the password while the user types it or while it is in transit. The password is a static secret, not a challenge-response, so there is no replay resistance and nothing binds it to the verifier's name.
