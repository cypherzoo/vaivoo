slug: openid-connect
name: OpenID Connect
aliases: ["OIDC", "OpenID Connect Core 1.0", "OpenID Connect 1.0"]
summary: "An identity layer on top of OAuth 2.0. A website or app (the Relying Party) sends the user to an OpenID Provider, which authenticates the user and returns a signed ID Token saying who the user is and how and when they were authenticated."
layer: [core, crypto]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  OAuth 2.0 lets an app obtain limited access to resources, but on its own it does not tell the app who the user is. OpenID Connect adds that. The app asks for the "openid" scope, the user is sent to the OpenID Provider (OP), and the OP returns an ID Token: a signed JSON Web Token naming the issuer, the user (subject), the intended audience and validity times.

  OpenID Connect does not say how the OP authenticates the user. The OP can use a password, a passkey, a national eID or anything else; OpenID Connect only carries the result. The optional acr and amr claims tell the Relying Party which assurance class or methods were used, if the parties agree on their meaning.

  Core defines three flows: Authorization Code, Implicit and Hybrid. In the Authorization Code Flow the browser carries only an authorization code, and the Relying Party's server exchanges it directly with the OP's Token Endpoint for the tokens. A nonce sent in the request and echoed in the ID Token ties the token to the user's session and helps detect replay.

  The security of a sign-in therefore depends on two things: how strongly the OP authenticated the user, and whether the Relying Party validates the ID Token correctly (issuer, audience, signature, expiry, nonce).
crypto: |
  ID Tokens are JSON Web Tokens signed with JSON Web Signature (JWS), and may additionally be encrypted with JWE (sign first, then encrypt). The default signing algorithm is RS256, an RSA signature with SHA-256; OPs must list RS256 among their supported ID Token signing algorithms in Discovery metadata. MAC-based algorithms such as HS256 use the client secret as the key.

  The Relying Party validates the signature with the OP's published keys, normally obtained through Discovery, rather than keys embedded in the token header. The unsigned "none" algorithm is permitted only in the narrow case where no ID Token is returned from the Authorization Endpoint (such as the Authorization Code Flow) and the client registered for it.

  The nonce is a random value the Relying Party generates and binds to the user's session; it must have enough entropy that attackers cannot guess it.
