        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 2 'Authentication Assurance Level 3' > 'Permitted Authenticator Types' (#aal3types) and Sec. 2.3.2 (#aal3req)"
        note: AAL3 allows only MF cryptographic, or SF cryptographic plus password or biometric; requires non-exportable key and phishing resistance.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-sms-otp-code-requirements
    predicate: verifier_requirements
    value: supported
    statement: "NIST requires the code to be at least six random decimal digits from an approved random bit generator, valid for at most 10 minutes and accepted only once. Codes under 64 bits require rate limiting, and sending a new code must not reset the failure count."
    scope: NIST SP 800-63B-4 out-of-band verifier requirements.
    assumptions: []
    claim_type: fact
    status: proposed
