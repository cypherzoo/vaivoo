  - id: claim-synced-passkey-uv-mfa
    predicate: multi_factor_qualification
    value: conditional
    statement: "Under NIST SP 800-63B-4, a syncable authenticator can be treated as a multi-factor cryptographic authenticator only when the UV flag shows local user verification (possession of the key plus a PIN or biometric activation factor); without UV it is single-factor."
    scope: NIST SP 800-63B-4 classification; other frameworks may differ.
    assumptions:
      - The UV flag is set in the response and the Relying Party inspects it.
      - The activation factor meets NIST Sec. 3.2.10 (activation secrets) or Sec. 3.2.3 (biometrics).
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/syncable/
        title: "NIST SP 800-63B-4: Appendix B. Syncable Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Appendix B, \"Implementation Requirements\" (#implementation-requirements), item \"User Verified (UV)\""
        note: Verifiers shall inspect UV; it indicates multi-factor treatment, and without user verification agencies shall treat it as single-factor cryptographic.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Sec. 3.1.7 Multi-Factor Cryptographic Authentication, subsection \"Multi-Factor Cryptographic Authenticators\" (#mfca); Sec. 3.2.10 Activation Secrets"
        note: Keys accessible only after an activation factor (password or biometric); activation secrets at least four characters, retry limit of 10.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-synced-passkey-uv-max-nist-aal
    predicate: max_nist_aal
    value: supported
    statement: "The highest NIST SP 800-63B-4 assurance level this profile can reach is AAL2. Syncable authenticators require an exportable private key and shall not be used at AAL3."
    scope: NIST SP 800-63B-4; AAL2 also requires the other AAL2 and Appendix B conditions to be met.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Sec. 2.3.2 Authenticator and Verifier Requirements (AAL3) (#aal3req)"
        note: Because syncable authenticators require an exportable private key, they shall not be used at AAL3.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/syncable/
        title: "NIST SP 800-63B-4: Appendix B. Syncable Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Appendix B, \"Cloning Authentication Keys\" (#cloning), closing note; \"Sharing\" (#sharing), last paragraph"
        note: AAL2 may be supported subject to the listed requirements; syncing violates AAL3 non-exportability; offered for applications up to AAL2.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-synced-passkey-uv-recovery-dependency
    predicate: recovery_dependency
    value: supported
    statement: "The overall security of this profile is bounded by the security of the passkey provider account and its recovery process, because whoever recovers that account can obtain the synced keys."
    scope: Interpretation drawing on NIST's threat table; the actual strength varies by passkey provider and is not assessed here.
    assumptions: []
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/syncable/
        title: "NIST SP 800-63B-4: Appendix B. Syncable Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Appendix B, \"Security Considerations\", Table 5, row \"Unauthorized access to sync fabric and recovery\""
        note: Synced keys are reachable via cloud account recovery, a potential weakness; mitigations include AAL2 access and user-controlled encryption secrets.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/syncable/
