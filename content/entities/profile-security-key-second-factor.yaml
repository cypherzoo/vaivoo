    predicate: user_verification_required
    value: not_supported
    statement: "In this profile the Relying Party sets userVerification to \"discouraged\", so the key only performs a test of user presence (typically a touch). WebAuthn states this is not user verification. NIST says that when a flag shows no activation factor was used, the authentication is single-factor."
    scope: Holds by configuration of this profile; the same key can perform UV if the RP requires it and the key supports it.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§4 Terminology, 'Test of User Presence' and 'User Present'"
        note: A user presence test is a simple gesture such as touching the authenticator; it does not constitute user verification.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§5.1.3 Create a New Credential, step setting the effective user verification requirement"
        note: When userVerification is set to discouraged, the client sets userVerification to false.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.7 'Multi-Factor Cryptographic Verifiers' (#multi-factor-cryptographic-verifiers)"
        note: If a flag indicates an activation factor was not used, the authentication SHALL be treated as single-factor.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-sk2f-device-bound
    predicate: non_exportable_key
    value: conditional
    statement: "The credential is a single-device credential (not backup-eligible, BE = 0) and the private key is generated and used inside the security key. NIST treats keys in a dedicated device such as a security key as non-exportable, provided the hardware cannot be made to release the key to the host."
    scope: Security keys used as roaming authenticators; specific hardware models are not assessed.
    assumptions:
      - "The security key generates, stores and uses the private key in protected hardware and cannot be reprogrammed by the host to extract it."
      - "The Relying Party checks that the BE flag is 0 if it relies on the credential being device-bound."
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§4 Terminology, 'Backup Eligibility / Backup Eligible'"
        note: Backup eligibility is set at creation, permanent, and signalled in flags; a non-backup-eligible source is a single-device credential.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.2 General Authenticator Requirements, subsection 'Exportability' (#export)"
        note: Keys are exportable unless generated, stored and used in protected hardware such as a dedicated security key; non-exportable devices SHALL prohibit export to the host.
