  - id: claim-ftn-rp-integration
    predicate: relying_party_integration
    value: supported
    statement: Online services usually get strong identification from a registered broker service rather than contracting with every eID provider. Means providers must give brokers access within one month of a request, on reasonable and non-discriminatory terms. Traficom publishes OpenID Connect (213/2023 S) and SAML 2.0 (212/2023 S) profiles for interfaces in the network.
    scope: Interfaces between means providers and brokers. Traficom says the profiles can also be applied between a broker and an online service.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
