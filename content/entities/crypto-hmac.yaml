  - id: claim-hmac-key-length
    predicate: key_parameters
    value: supported
    statement: The minimum recommended key length is L bytes (the hash output length). Keys longer than the block length B are hashed first. Keys should be random or cryptographically pseudorandom and refreshed periodically.
    scope: Key guidance in RFC 2104.
