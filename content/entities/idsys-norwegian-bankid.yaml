type: IdentitySystem
slug: norwegian-bankid
name: Norwegian BankID
aliases: [BankID (Norway), BankID Norge]
summary: Norway's bank-issued electronic ID, used to log in and sign electronically at banks, public services (via ID-porten) and private businesses.
layer: [nordic-eu, core]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  Norwegian BankID is a personal electronic ID for logging in and signing online. The Norwegian banks developed it together and launched it in 2004. The banks issue it to their private customers. The operator, Stø AS, maintains and develops the service and sells it to businesses through resellers. The company took the name Stø AS in May 2025. Norwegian BankID is not the same scheme as Swedish BankID.

  People use it to log in to online banking and private services, and to log in to Norwegian public services through ID-porten, the government's shared login service. They can also use it to sign documents electronically, for example loan applications.

  To get Norwegian BankID, you go to your bank and show your passport. You must be at least 12 years old. To log in, you enter your national identity number, a one-time code and a personal password. The code comes from the BankID app or from a code device. The operator says the "BankID on mobile" variant is being phased out and can no longer be created. In the BankID app, users can also turn on a faster mode that uses face recognition, fingerprint or a PIN. The operator rates this biometric mode at a lower assurance level than the standard login.

  Businesses that rely on Norwegian BankID connect to it through OpenID Connect. They can choose between a "BankID High" login and a "BankID with biometrics" login, which have different levels of assurance.
crypto: |
  Signing is based on PKI. The operator's developer documentation describes X.509 certificates issued by its signing service. The current qualified certificates for natural persons are short-lived (15 minutes in the published example). They carry an elliptic-curve P-256 public key, and the issuing CA signs them with ECDSA with SHA-384. They also include ETSI qualified-certificate statements, including one saying the key is held on a qualified signature-creation device. The documentation does not say where that device is or who operates it.

  The "BankID with biometrics" login is built on WebAuthn. The operator's documentation says it uses a hardware-bound private key held in tamper-resistant hardware on the user's phone.

  For the standard "BankID High" login (one-time code from the app or a code device, plus a password), the sources reviewed here do not publicly state where the user's private keys are held or what algorithms are used. This entry treats both as not publicly specified.
