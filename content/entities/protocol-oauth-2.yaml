    statement: "OAuth 2.0 (RFC 6749) is an authorization framework that lets a third-party application obtain limited access to an HTTP service, either on behalf of a resource owner through an approval interaction or on its own behalf. It is a Standards Track RFC published October 2012 and obsoletes OAuth 1.0 (RFC 5849)."
