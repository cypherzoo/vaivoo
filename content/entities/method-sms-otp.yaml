  - id: claim-sms-otp-mfa-qualification
    predicate: mfa_qualification
    value: conditional
    statement: "An SMS code on its own is a single 'something you have' factor. It contributes to AAL2 only when combined with a password or biometric comparison. A phone that requires an activation factor before the code can be read or entered could count as a multi-factor out-of-band authenticator, but a plain SMS flow does not ensure that."
    scope: NIST SP 800-63B-4 AAL1/AAL2 classification; other frameworks not assessed.
    assumptions:
      - "Single-factor case: the SMS code is combined with a separately verified password or biometric comparison in the same authentication."
      - "The restricted-authenticator obligations of Sec. 3.2.9 are met by the CSP."
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 2 'Authentication Assurance Level 2' > 'Permitted Authenticator Types' (#aal2types)"
        note: Two single-factor authenticators must include a physical authenticator, such as an out-of-band device, plus a password or biometric comparison.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.3 Out-of-Band Devices (#out-of-band); Sec. 3.1.3.4 Multi-Factor Out-of-Band Authenticators (#mfooba)"
        note: Out-of-band is "something you have"; multi-factor variants need an activation factor on each use.
        stance: supports
        retrieved_at: "2026-10-03"
