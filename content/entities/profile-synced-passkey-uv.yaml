claims:
  - id: claim-synced-passkey-uv-phishing-resistance
    predicate: phishing_resistance
    value: conditional
    statement: "Sign-in with a synced passkey is phishing-resistant through verifier name binding: the credential is scoped to the RP ID and the signed client data carries the origin, which the Relying Party verifies."
    scope: The WebAuthn authentication ceremony only. Account recovery, enrollment of new authenticators and session handling are assessed separately.
    assumptions:
      - The Relying Party verifies the client data origin and the rpIdHash exactly as in WebAuthn §7.2.
      - The RP ID is the site's domain or a parent domain at least one level below the public suffix.
      - The user's device and browser are not compromised.
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Sec. 3.2.5 Phishing Resistance, subsection \"Verifier Name Binding\" (#verifier-name-binding)"
        note: Verifier name binding binds output to the authenticated verifier identifier; WebAuthn is cited as providing phishing resistance this way.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://pages.nist.gov/800-63-4/sp800-63b/syncable/
        title: "NIST SP 800-63B-4: Appendix B. Syncable Authenticators"
        publisher: NIST
        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Appendix B, \"Example\" (#example), item \"Phishing resistance\""
        note: Properly configured syncable authenticators use a key pair constrained to the creating domain, so a fake page cannot capture and reuse the output.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§7.2 Verifying an Authentication Assertion (steps verifying C.origin and rpIdHash)"
        note: RP must check the client-data origin is expected and that rpIdHash equals the SHA-256 of its expected RP ID.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-synced-passkey-uv-passwordless
    predicate: passwordless
    value: conditional
    statement: The passkey can be used as the sole sign-in step without a password; with user verification required, the local unlock gesture takes the place of the password.
    scope: Primary sign-in flow; the RP may still keep a password for fallback or recovery.
    assumptions:
      - The Relying Party sets userVerification to required and checks the UV flag.
      - The Relying Party does not also demand a password in the sign-in flow.
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
