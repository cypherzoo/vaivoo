        version: "SP 800-63B-4 (HTML edition dated 26 Aug 2025)"
        locator: "Appendix B, \"Cloning Authentication Keys\" (#cloning)"
        note: Requires encrypted storage in the sync fabric, access limited to the authenticated user, and AAL2-equivalent MFA for access to the keys.
        stance: contextualizes
