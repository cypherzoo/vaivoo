        locator: "Sec. 3.2.5 Phishing Resistance (#verifimpers); Sec. 3.2.5.1 Channel Binding (#channel-binding); Sec. 3.2.5.2 Verifier Name Binding (#verifier-name-binding)"
        note: Two recognised methods; channel binding is stronger as it survives misissued certificates; WebAuthn provides verifier name binding by choosing the authenticator secret based on the verifier's authenticated domain name.
        stance: supports
        retrieved_at: "2026-10-03"
