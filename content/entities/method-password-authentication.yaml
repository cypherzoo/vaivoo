        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/passwords/
        title: "NIST SP 800-63B-4: Appendix A. Strength of Passwords"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Appendix A (informative), 'Complexity' (#complexity)"
        note: Users respond predictably to composition rules (for example 'Password1!'); blocklists of breached and dictionary passwords are recommended instead.
        stance: supports
        retrieved_at: "2026-10-03"
