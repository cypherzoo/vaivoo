id: attack-session-token-theft
type: Attack
slug: session-token-theft
name: Session token theft
aliases: [Session hijacking, Session cookie theft, Pass-the-cookie, Token theft, Token replay]
summary: "Instead of beating the sign-in, the attacker steals the session cookie or token issued after it, using malware on the device or a phishing relay, and reuses it. Strong authentication does not protect a session secret that is a plain bearer token once it has been issued. Binding the secret to the device, short lifetimes and session monitoring reduce the risk."
layer: [core]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  After a successful sign-in, the service gives the browser or app a session secret, usually a cookie, so the user does not have to authenticate on every request. For web services, NIST notes that cookies are not authenticators. They are short-term secrets, and whoever presents the secret continues the session.

  If an attacker copies that secret, they can often use the session from their own machine without knowing the password and without passing any second factor. The sign-in has already happened. This is why even the strongest authenticator does not, by itself, protect against session theft.

  There are two main routes. Malware on the user's device, often called an infostealer, reads cookies from the browser's files or memory and sends them to the attacker. A phishing relay (see adversary-in-the-middle phishing) captures the cookie as the real service issues it. Malicious scripts injected into a web page are a third route. Phishing-resistant authentication blocks the relay route, because the relay cannot complete the sign-in. It does not stop malware that copies a cookie after a genuine sign-in.

  Defences work on the session rather than on the sign-in. Newer mechanisms make the browser prove possession of a key that cannot easily be extracted, so a copied value alone is useless. Examples include the emerging device-bound session credentials specification for cookies and sender-constrained tokens (DPoP) for OAuth. Other measures are cookie settings that keep secrets away from scripts and insecure connections, session lifetimes and inactivity timeouts, and monitoring sessions for unusual use.

  Session lifetimes involve a trade-off. NIST sets maximum reauthentication intervals for each assurance level. The UK NCSC cautions that rigid short timeouts do little against attackers who act quickly and can make users more prone to phishing, and it prefers reauthentication triggered by signs of risk.
crypto: |
  A bearer cookie is a random value, at least 64 bits from an approved generator under NIST's rules. The server checks only that the value matches a live session. Nothing ties it to the device, the TLS connection or the authenticator used to sign in, so a copy works just as well as the original.

  Proof-of-possession designs change this. The client holds a private key, ideally in protected hardware, and signs a fresh challenge or request. The server checks the signature against a public key it bound to the session. A stolen session identifier without the key fails the check. RFC 9449 (DPoP) applies this to OAuth access and refresh tokens at the application layer. NIST notes that device-bound session credentials aim to do the same for browser sessions, but still requires session time limits to be enforced.
