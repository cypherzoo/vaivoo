  - id: claim-rsa-quantum-vulnerable
    predicate: quantum_vulnerability
    value: supported
    statement: RSA signatures are vulnerable to Shor's algorithm on a cryptographically relevant quantum computer, whatever the modulus size. NIST notes that authentication stays secure as long as the algorithm is unbroken when the authentication takes place.
    scope: Future large-scale quantum adversary; no claim on when such a computer will exist.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
        title: "NIST IR 8547 (Initial Public Draft): Transition to Post-Quantum Cryptography Standards"
        publisher: NIST
        version: Initial Public Draft (November 12, 2024); still listed as draft on CSRC at retrieval
        publication_date: "2024-11-12"
        locator: Section 2.1.1 (Digital Signature Algorithms)
        note: The FIPS 186 algorithms, including RSA per RFC 8017, are vulnerable to Shor's algorithm on a cryptographically relevant quantum computer.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
        title: "NIST IR 8547 (Initial Public Draft): Transition to Post-Quantum Cryptography Standards"
        publisher: NIST
        version: Initial Public Draft (November 12, 2024)
        publication_date: "2024-11-12"
        locator: Section 3.1.2 (User and Machine Authentication)
        note: Authentication is not exposed to harvest-now-decrypt-later; it stays secure while the algorithms are secure at the moment of authentication.
        stance: contextualizes
        retrieved_at: "2026-10-03"
  - id: claim-rsa-nist-transition-timeline
    predicate: deprecation_timeline
    value: conditional
    statement: Under NIST's proposed plans, RSA signatures at 112-bit strength (2048-bit moduli) would be deprecated after 2030 and disallowed after 2035, and RSA at 128 bits or more (3072 bits and up) would be disallowed after 2035. Both documents setting out these dates are still drafts.
    scope: NIST-approved (US federal) use. The current final guidance, SP 800-131A Rev. 2, rates 2048-bit RSA signature generation as acceptable with no end date.
    assumptions:
      - NIST IR 8547 and SP 800-131A Rev. 3 are finalised with the dates in their initial public drafts (as of 2026-10-03 the CSRC pages still list only the drafts, from November 2024 and October 2024).
      - Applies to NIST approval status; other jurisdictions and sectors may set different dates.
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
