id: method-sms-otp
type: Method
slug: sms-otp
name: SMS one-time code
aliases: [SMS OTP, Text-message code, SMS verification code, PSTN out-of-band authentication]
summary: "The service sends a short random code to the user's registered phone number by text message, and the user types it in. NIST treats this as a restricted out-of-band authenticator. It is not phishing-resistant and depends on control of the phone number."
layer: [core]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  At sign-in, the service generates a random code, normally six digits, and sends it as a text message to the phone number on the account. The user reads the code and types it into the sign-in page. The code is valid for a short time and only once.

  NIST classifies this as an out-of-band authenticator: proof that the user controls a device reachable on a separate channel ("something you have"). Because it uses the public telephone network, NIST marks it as a restricted authenticator. Organizations that accept it must assess the risks, warn users about them, offer at least one unrestricted alternative and plan for migration.

  The code goes wherever the phone network delivers the number. If an attacker gets the number moved to their own SIM or ported to another provider, they receive the codes. NIST tells verifiers to check signals such as SIM changes and number porting before sending a code.

  Because the user types the code by hand, a fake site can ask for it and relay it to the real service in real time. SMS codes are therefore not phishing-resistant and cannot be used at AAL3.
crypto: |
  There is little cryptography in the method itself. The verifier must generate a random secret of at least six decimal digits with an approved random bit generator. The check is a simple comparison within a 10-minute window, accepted only once. Since a six-digit code is far below 64 bits, rate limiting is mandatory, and sending a new code must not reset the failure count.

  NIST requires approved encryption on the out-of-band channel except when the secret goes over the public switched telephone network. SMS delivery therefore falls under that exemption. The device is identified to the mobile network by its SIM card or equivalent secret, not by a key the verifier controls, so the verifier has no cryptographic proof of which device received the code.

  Nothing in the code is bound to the verifier's name or to the TLS session, so the code works for whoever submits it first.
