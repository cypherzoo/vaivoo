  - id: claim-norwegian-bankid-assurance-level
    predicate: assurance_level
    value: conditional
    statement: The operator presents the "BankID High" login as the highest level of assurance, returning acr "urn:bankid:bid;LOA=4"; the "BankID with biometrics" login returns LOA=3.
    scope: Operator's own classification in its OIDC service. The EU notification at level High is covered in claim-norwegian-bankid-eidas-notification; the Norwegian self-declaration register (Nkom) entry was not retrieved.
    assumptions:
      - The relying party requests the BankID High identity provider (acr_values urn:bankid:bid); the biometric variant is LOA=3.
      - LOA=4 is the operator's own label, which maps to the top of the three eIDAS/Norwegian levels (lavt, betydelig, høyt); a regulator's confirmation is still needed.
    claim_type: vendor_claim
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
