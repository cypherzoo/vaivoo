  - id: claim-rfc4226-throttling
    predicate: rate_limiting_required
    value: supported
    statement: Because truncation makes brute force feasible, RFC 4226 recommends that the server throttle or lock out after a limited number of failed attempts, or add increasing delays. Lockout or delay MUST apply across login sessions.
    scope: Server-side security requirements of RFC 4226.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
