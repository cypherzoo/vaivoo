  - id: claim-aitm-phishing-session-cookie-capture
    predicate: captures_session_token
    value: supported
    statement: "Besides credentials, a relay can capture the session cookie the real service issues after sign-in, and the attacker can reuse it without signing in again. MITRE ATT&CK lists phishing relays as one way to steal session cookies, and notes that an authenticator which includes the login domain in its protocol prevents cookie theft through such a proxy."
    scope: Web sessions maintained by bearer cookies; the domain-binding mitigation applies to the relay path only.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://attack.mitre.org/techniques/T1539/
        title: "Steal Web Session Cookie, Technique T1539 - Enterprise"
        publisher: The MITRE Corporation (MITRE ATT&CK)
        version: "T1539 version 1.5 (ATT&CK v19), last modified 12 May 2026"
        locator: "Technique description, paragraph on malicious proxies; Mitigations table, M1032 Multi-factor Authentication"
        note: Open-source proxy frameworks gather session cookies in phishing campaigns; hardware tokens that bind the login domain into the protocol prevent cookie theft through proxy methods.
        stance: supports
