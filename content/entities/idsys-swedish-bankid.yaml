name: Swedish BankID
aliases: [BankID (Sweden), Svenskt BankID, Mobilt BankID, BankID på fil, BankID på kort]
summary: Sweden's most widely used electronic ID, issued by Swedish banks and run by Finansiell ID-Teknik BID AB, used to identify and sign at companies and public authorities.
layer: [nordic-eu]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  Swedish BankID is a personal electronic ID used in Sweden to identify yourself and sign online, at banks, companies and public authorities. It is run by Finansiell ID-Teknik BID AB. The company was set up in September 2002 by a group of major Swedish banks, and the first BankID was issued in 2003. Swedish BankID is a different scheme from Norwegian BankID.

  You get BankID from your bank, not from the operator. You need a Swedish personal identity number, you must be a customer of an issuing bank, and you must be identified with a valid ID document. The bank sets the age limit. The operator lists the banks that issue it.

  BankID comes in three forms: Mobile BankID (an app on a phone or tablet), BankID on file (software on a computer) and BankID on card (a smart card). Sweden's Agency for Digital Government (Digg) has approved all three under its trust framework for Swedish e-ID at Swedish level of assurance 3. Digg says level 3 corresponds to the eIDAS level "substantial". Digg also lists the three forms as notified to the EU at level substantial, but the European Commission's own overview marks only Freja eID as notified among the Swedish means. A reviewer should resolve this.

  Services connect to BankID through the operator's web API (the "RP API"). A service first needs an agreement with a bank that resells BankID, and a client certificate ordered from that bank. When the user is on another device, the service shows an animated QR code. The code changes every second, and the operator says this makes remote fraud harder. Other e-IDs used in Sweden, such as Freja, are not covered here.
crypto: |
  Animated QR code: each QR frame carries the string "bankid.qrStartToken.time.qrAuthCode". The qrAuthCode is HMAC-SHA256 over the number of seconds since the order started, keyed with a qrStartSecret. The service backend receives the secret from the BankID API and must not send it to the browser. The operator says the code should be regenerated every second and that an order is valid for 30 seconds.

  PKI: relying parties authenticate to the API with an organisation certificate. They create a key pair and certificate request with the operator's Keygen tool and get the certificate issued by their bank. Signatures returned by the service include the user's certificate, the intermediate CA certificates and an OCSP response. The operator says it has already verified them, and documents how a relying party can re-verify the chain to its self-signed root. In the sample proof of identity for the digital ID card check, the signature is XAdES (ETSI TS 103 171 B-B) with RSA-SHA256. The sources reviewed do not say where users' private keys are stored on phones, computers or cards, or which algorithms user keys use.
