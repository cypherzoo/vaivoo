id: credential-passkey
type: Credential
slug: passkey
name: Passkey
aliases: ["discoverable credential", "client-side discoverable credential", "FIDO credential", "synced passkey", "device-bound passkey"]
summary: "A WebAuthn/FIDO public-key credential, scoped to one website or app, that the user unlocks the same way they unlock their device. WebAuthn Level 3 lists \"passkey\" as a term for a client-side discoverable credential."
layer: [core, crypto]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  A passkey replaces a password with a key pair. The website keeps only the public key; the private key stays with the user's authenticator, which may be built into a phone or computer, held by a passkey provider, or stored on a security key.

  Because a passkey is discoverable, the user does not have to type a username first: the website can ask for any passkey it accepts, and the user picks an account and approves with a fingerprint, face, PIN or pattern.

  Each passkey is tied to one website (its RP ID), so it cannot be used on a look-alike site. The industry body that promotes passkeys distinguishes synced passkeys, which a passkey provider copies to the user's other devices, from device-bound passkeys, which never leave a single device.
crypto: |
  A passkey is a per-site asymmetric key pair created during WebAuthn registration. Sign-in is a challenge-response: the authenticator signs authenticator data (including the SHA-256 hash of the RP ID and the user-presence/user-verification flags) together with a hash of the client data (server challenge plus calling origin). The private key is never sent to the server, so a server breach exposes no reusable secret.

  The algorithm is named with a COSE algorithm identifier (for example -7 ES256, -8 EdDSA, -257 RS256). How a synced passkey's private key is protected while stored by and copied through a passkey provider is not defined by WebAuthn and is provider-specific.
