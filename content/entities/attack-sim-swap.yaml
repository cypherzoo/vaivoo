id: attack-sim-swap
type: Attack
slug: sim-swap
name: SIM swap and number porting
aliases: [SIM swap, SIM swapping, SIM hijacking, Port-out fraud, Phone number takeover]
summary: "The attacker gets the victim's phone number moved to a SIM card or provider they control, usually by deceiving or bribing mobile operator staff. From then on, SMS and voice codes go to the attacker. Authenticators that do not depend on the phone number are not affected."
layer: [core]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  A phone number is not tied to a particular phone. The mobile operator decides which SIM card, or which operator after a port, the number belongs to. In a SIM swap, the attacker persuades the operator to move the victim's number to a SIM card they hold. In a port-out, the number is moved to another operator. Either way, the victim's phone loses service and the attacker's phone starts receiving the victim's calls and texts.

  Attackers typically do this by pretending to be the victim, by paying an insider at the operator, or by phishing operator staff to get into operator systems. The attacker often already has the victim's password or personal details.

  Once they control the number, the attacker can receive SMS and voice one-time codes and complete sign-ins. They can also use "forgot password" flows that send a reset link or code to the phone, which can give them control of the account even without the password.

  The attack does not touch the victim's device or the authentication service. It works because SMS and voice codes prove control of a phone number, not possession of a specific device. Authenticator apps, security keys and passkeys are not affected directly, unless the account lets the phone number be used to recover or replace them.

  NIST treats delivery of codes over the telephone network as a restricted authenticator, partly for this reason. It tells services to check for signs such as a recent SIM change or number port before sending a code, and to treat a change of phone number as binding a new authenticator.
