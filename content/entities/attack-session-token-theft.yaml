  - id: claim-session-token-theft-cookie-attributes
    predicate: mitigation
    value: supported
    statement: "NIST requires session cookies to be sent only over HTTPS and limited to the fewest practical hosts and paths. It recommends HttpOnly, the __Host- prefix, SameSite Lax or Strict, opaque values only, and keeping session secrets out of HTML5 local storage because of cross-site scripting risk."
    scope: Browser cookies used for session maintenance under NIST SP 800-63B-4. These settings mainly limit script and network exposure; they do not stop malware that reads the browser's cookie store.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/session/
        title: "NIST SP 800-63B-4: Session Management"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 5.1.1 Browser Cookies (#sesscookies), numbered list; Sec. 5.1 (#bindings), paragraph on HTML5 Local Storage"
        note: SHALL be HTTPS-only and minimally scoped; SHOULD be HttpOnly, use __Host- prefix, SameSite Lax/Strict and opaque content; session secrets SHOULD NOT be placed in local storage due to XSS.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-session-token-theft-timeouts
    predicate: mitigation
    value: conditional
    statement: "Session timeouts limit how long a stolen secret is useful. NIST sets an overall reauthentication limit of 24 hours (with a 1-hour inactivity timeout recommended) at AAL2, and 12 hours (with 15 minutes recommended) at AAL3. The UK NCSC cautions that attackers often act before a timeout expires and that frequent reauthentication can make users easier to phish. It prefers reauthentication triggered by risk."
    scope: Combines NIST normative limits with NCSC guidance that partly disagrees on value; effectiveness depends on attacker speed.
    assumptions:
      - "The stolen secret is used after the overall or inactivity timeout would have expired; timeouts give no protection against immediate reuse."
      - "Timeouts are enforced on the server, not only by cookie expiry, as NIST requires."
    claim_type: interpretation
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/aal/
        title: "NIST SP 800-63B-4: Authentication Assurance Levels"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 2.2.3 Reauthentication (#aal2reauth); Sec. 2.3.3 Reauthentication (#aal3reauth)"
        note: AAL2 overall timeout SHOULD be no more than 24 hours, inactivity SHOULD be no more than 1 hour; AAL3 overall SHALL be no more than 12 hours, inactivity SHOULD be no more than 15 minutes.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://attack.mitre.org/techniques/T1539/
        title: "Steal Web Session Cookie, Technique T1539 - Enterprise"
        publisher: The MITRE Corporation (MITRE ATT&CK)
        version: "T1539 version 1.5 (ATT&CK v19), last modified 12 May 2026"
        locator: "Mitigations table, M1054 Software Configuration"
        note: Minimising cookie lifetime and using non-persistent cookies reduce the impact of stolen cookies and force more frequent theft attempts.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.ncsc.gov.uk/collection/mfa-for-your-corporate-online-services/avoiding-mfa-anti-patterns
        title: "Multi-factor authentication for your corporate online services: Avoiding MFA anti-patterns"
        publisher: UK National Cyber Security Centre (NCSC)
        version: "Version 2.0"
        publication_date: "2024-09-26"
        locator: "Section '3. Time-based re-authentication'"
        note: Short fixed timeouts limit a stolen session credential's useful life but attackers often act quickly, cut-off can be delayed, and frequent reauthentication desensitises users; prefers detection-triggered reauthentication.
        stance: contextualizes
        retrieved_at: "2026-10-03"
  - id: claim-session-token-theft-monitoring
    predicate: detection
    value: supported
    statement: "Session monitoring can detect the use of stolen tokens by checking usage patterns, device and browser characteristics, location and IP address during the session. NIST allows this, and says that on suspected fraud the service should reauthenticate, end the session or alert staff. NIST also requires these checks to be included in the privacy risk assessment."
    scope: NIST SP 800-63B-4 Sec. 5.3 (permissive, not mandatory) and MITRE ATT&CK detection guidance.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
