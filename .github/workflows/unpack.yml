# One-time helper: unpacks vaivoo-site-upload.zip into the repo root. Delete after it has run.
name: One-time unpack
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP into root (workflow files are added separately)
        run: |
          test -f vaivoo-site-upload.zip || { echo "ZIP not found"; exit 1; }
          unzip -q vaivoo-site-upload.zip -d /tmp/unz
          rm -rf /tmp/unz/vaivoo-site/.github
          cp -a /tmp/unz/vaivoo-site/. .
          sed -i 's#repo `vaivoo-site`#repo `cypherzoo/vaivoo`#' README.md
          git rm -q vaivoo-site-upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Unpack initial scaffold from ZIP"
          git push
