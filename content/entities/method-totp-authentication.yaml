claims:
  - id: claim-totp-spec-rfc6238
    predicate: specified_by
    value: supported
    statement: TOTP is specified in IETF RFC 6238 (May 2011), an Informational RFC that extends the HOTP algorithm of RFC 4226 with a time-based moving factor.
    scope: Algorithm definition only; provisioning and user interface are out of scope of the RFC.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: Abstract; Section 1.1 (Scope)
        note: Describes an extension of HOTP (RFC 4226) that replaces the event counter with a time-based moving factor to produce short-lived OTP values.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-totp-based-on-hotp
    predicate: based_on
    value: supported
    statement: "TOTP is defined as HOTP(K, T), where T is the number of time steps between T0 and the current Unix time, and HOTP is a mandatory building block."
    scope: Algorithm definition.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: "Section 3 (Algorithm Requirements), R3; Section 4.2 (Description)"
        note: "R3 says the algorithm MUST use HOTP as a key building block; Section 4.2 defines TOTP = HOTP(K, T) with T = (current Unix time - T0) / X, floored."
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc6238
        title: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 6238 (May 2011)
        locator: Section 1.2 (Background)
        note: TOTP is the time-based variant of HOTP, where a value T derived from a time reference and time step replaces the counter C.
        stance: supports
        retrieved_at: "2026-10-03"
