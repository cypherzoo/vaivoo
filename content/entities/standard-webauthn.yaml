id: standard-webauthn
type: Standard
slug: webauthn
name: Web Authentication (WebAuthn)
aliases: ["WebAuthn", "W3C Web Authentication", "WebAuthn Level 3"]
summary: "W3C specification that defines a browser API and authenticator model for creating and using public-key credentials scoped to a website (Relying Party). Level 3 was published as a W3C Recommendation on 25 August 2026."
layer: [core, crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
body: |
  WebAuthn defines how a website asks the browser to create a new key pair for the user (registration) and later to prove possession of that key (authentication). The browser talks to an authenticator: a component built into the device, or a separate one such as a security key or phone.

  Each credential is scoped to one Relying Party, identified by its RP ID (a domain). The browser fills in the website's origin, and the authenticator records a hash of the RP ID. The site's server checks both, so a look-alike domain cannot obtain a usable response for the real site.

  The specification also defines flags that tell the server whether the user was present, whether the user was verified locally (for example by PIN or biometric), and whether the credential may be, or currently is, backed up to other devices. Optional attestation lets an authenticator vouch for its make and model.

  Level 3 is the third version of the specification. It follows Level 1 (2019) and Level 2 (2021).
crypto: |
  At registration the authenticator generates a new asymmetric key pair for the RP ID and returns the public key in COSE_Key format. The private key is not sent to the server.

  At authentication the authenticator signs the concatenation of its authenticator data (which starts with the SHA-256 hash of the RP ID and carries the UP/UV/BE/BS flags) and a SHA-256 hash of the client data JSON (which contains the server's random challenge and the calling origin). The server verifies this signature with the stored public key.

  Algorithms are named by COSE algorithm identifiers from the IANA registry. The specification gives -7 (ES256) and -257 (RS256) as examples, and requires user agents to be able to export public keys for -7 (ES256, P-256), -257 (RS256) and -8 (EdDSA, Ed25519).
