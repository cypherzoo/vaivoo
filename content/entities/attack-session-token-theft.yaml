  - id: claim-session-token-theft-session-binding
    predicate: session_binding
    value: supported
    statement: "NIST says proof-of-possession session mechanisms, such as the emerging device-bound session credentials, reduce theft of session secrets compared with bearer tokens, and may persist while bearer secrets should not. Session time limits must still be enforced. RFC 9449 (DPoP) applies the same idea to OAuth tokens by sender-constraining them."
    scope: NIST SP 800-63B-4 Sec. 5.1 and IETF RFC 9449; deployment status of device-bound session credentials is not assessed (NIST calls it emerging).
