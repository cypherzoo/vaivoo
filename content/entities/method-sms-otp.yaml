claims:
  - id: claim-sms-otp-restricted
    predicate: nist_classification
    value: supported
    statement: "NIST SP 800-63B-4 treats SMS codes as out-of-band authentication over the PSTN, which it designates a restricted authenticator: the only one at publication. A CSP that accepts it must offer at least one unrestricted alternative at the required AAL, warn users about the risks, address them in its risk assessment and keep a migration plan."
    scope: NIST SP 800-63B-4; NIST notes it may change the restricted status as the threat landscape evolves.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.3.3 Authentication Using the Public Switched Telephone Network (#pstnOOB)"
        note: Use of the PSTN for out-of-band verification is restricted and SHALL satisfy Sec. 3.2.9; verifiers SHALL ensure alternative authenticator types are available.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.2.9 Restricted Authenticators (#restricted)"
        note: PSTN out-of-band is the one restricted authenticator; CSPs SHALL offer an unrestricted alternative, give meaningful notice, assess risks and plan migration.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.3.1 Out-of-Band Authenticators (#ooba)"
        note: Secondary channel SHALL use approved encryption unless sent via the PSTN; a SIM-authenticated device may receive secrets via SMS or voice.
        stance: contextualizes
        retrieved_at: "2026-10-03"
  - id: claim-sms-otp-sim-swap-porting-risk
    predicate: vulnerable_under
    value: supported
    statement: "SMS codes are exposed to attacks that move the phone number to another device or provider, such as SIM changes and number porting. NIST tells verifiers to consider such risk indicators before sending a code over the PSTN, and treats changing the registered number as binding a new authenticator."
    scope: Interpretation of NIST's risk-indicator and binding requirements; attack prevalence is not assessed.
    assumptions: []
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.3.3 Authentication Using the Public Switched Telephone Network (#pstnOOB)"
        note: Verifiers SHOULD consider device swap, SIM change, number porting and other abnormal behaviour before sending a PSTN secret; number changes follow Sec. 4.1.2 binding rules.
        stance: supports
        retrieved_at: "2026-10-03"
