slug: mitid
name: MitID (Denmark)
aliases: [MitID, MitID Erhverv]
summary: Denmark's national digital ID, owned by a public-sector and bank partnership, used to log in and approve actions at public self-service sites and in online banking.
layer: [nordic-eu, core]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  MitID is Denmark's digital ID. People use it to log in to public self-service sites such as borger.dk, skat.dk and sundhed.dk, and to approve actions such as money transfers in online banking. The MitID partnership owns it. The partnership is the Danish Agency for Digital Government (representing the state, regions and municipalities) and the financial institutions, represented by Finance Denmark. MitID was phased in from October 2021 to June 2023 and replaced NemID.

  MitID is free, the minimum age is 13, and having it is not mandatory. The main authenticator is the MitID app: the user enters a user ID at the service, opens the app and approves with a swipe after a PIN or device biometrics. On a computer the app scans a QR code shown on screen; on the same phone a button switches to the app. If the user cannot use the app, there are three alternatives. The code display and the audio code reader show or read out time-based one-time codes. The MitID chip is a paid hardware device connected by USB, NFC or Bluetooth. The code display, audio code reader and chip are used together with a MitID password.

  Services do not connect to MitID directly. Every service provider goes through a certified MitID broker. NemLog-in is the broker for public-sector services, and bank brokers serve the banks. Companies and associations that act on their own behalf in public self-service use a separate business product, MitID Erhverv.

  Denmark has notified MitID under eIDAS at levels of assurance Substantial and High. Internally MitID uses the levels low, substantial and high from the Danish NSIS standard, and the service provider chooses which level it requires.
crypto: |
  The operator's background paper says that activating the MitID app binds two key pairs to the user's MitID, held between the app and the MitID servers. ECDSA is used for signing and RSA for public-key encryption. The transaction text is encrypted so that only the user's app can read it. The app PIN is never sent to the server. Instead, a derivative is checked centrally using a zero-knowledge password proof (ZKPP) protocol. Device biometrics only unlock the PIN locally and are not a separate authentication factor. The paper does not give the elliptic curves or key sizes.

  The core system's cryptographic keys are held in hardware security modules approved to FIPS 140-2. The MitID chip is listed as FIDO U2F certified, using ECDSA and SHA-256. The code display and audio code reader produce TOTP codes, but the TOTP parameters (algorithm, time step, digits) are not publicly specified in the sources reviewed.
