  - id: claim-device-bound-passkey-uv-attestation
    predicate: attestation_available
    value: conditional
    statement: "The Relying Party can request attestation (\"direct\", or \"enterprise\" in controlled deployments) to learn which authenticator holds the key. Enterprise attestation may uniquely identify the authenticator and is only released where configuration permits it for the RP ID."
    scope: Registration-time attestation. Default conveyance is "none".
    assumptions:
      - The Relying Party requests a conveyance other than "none".
      - The authenticator produces a verifiable attestation statement; for "enterprise", the user agent or authenticator configuration permits it for the RP ID.
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
