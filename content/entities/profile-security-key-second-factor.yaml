schema_version: "1.1"
taxonomy_version: "1.0.0"
id: profile-security-key-second-factor
type: DeploymentProfile
slug: security-key-second-factor
name: Password plus hardware security key
aliases: ["security key as second factor", "password + roaming WebAuthn authenticator", "FIDO2 security key 2FA"]
summary: "A deployment in which the user types a password and then touches a separate hardware security key. The key signs a WebAuthn challenge bound to the website's domain. The key only checks that someone is present; the password supplies the knowledge factor."
layer: [core, crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
configuration:
  first_factor: password
  second_factor: roaming hardware security key via WebAuthn/FIDO2
  authenticator_attachment: cross-platform (roaming), e.g. over USB, NFC or BLE
  user_verification: "typically discouraged / not required (user presence only)"
  credential_storage: device-bound on the security key
  backup_eligibility_flag: "BE = 0 expected (single-device credential)"
  key_exportability: non-exportable (dedicated hardware)
body: |
  The user first signs in with a password as usual. The website then asks for a WebAuthn assertion, and the user plugs in or taps a small hardware security key and touches it. The key signs the website's challenge with a private key it created for that site when the key was registered.

  In this profile the website does not ask the key to verify the user with a PIN or fingerprint. A touch only proves that someone is present. The password provides "something you know" and the key provides "something you have", so together they form two-factor authentication.

  The key's signature is bound to the website's domain, so a fake site cannot use it. The password can still be phished, but a stolen password alone is not enough to sign in. The private key is meant never to leave the key, so the credential cannot be copied or synced. If the key is lost, the user needs another registered key or the account recovery process, and the strength of that fallback matters as much as the key itself.
crypto: |
  At registration the security key creates a credential key pair scoped to the website's RP ID and returns the credential public key. At sign-in the verifier sends a fresh random challenge (NIST requires at least 64 bits), and the key returns a signed assertion. WebAuthn states that the full origin of the requester is included and signed over in every assertion, so a response obtained on another origin does not verify.

  The assertion carries flags. With user verification discouraged, a touch satisfies the test of user presence, and no user verification is requested. A credential on a security key is not backup-eligible (BE = 0), which WebAuthn calls a single-device credential.

  The private key stays inside the security key. NIST treats keys as non-exportable when they are generated, stored and used in protected hardware such as a dedicated security key. The verifier holds only the public key, so a server breach does not reveal anything that can produce signatures.
relations:
  - { predicate: specified_by, object_id: standard-webauthn, claim_id: claim-sk2f-phishing-resistance }
  - { predicate: depends_on, object_id: method-password-authentication, claim_id: claim-sk2f-mfa, note: "The password supplies the knowledge factor; the key is used without user verification." }
  - { predicate: alternative_to, object_id: method-sms-otp, claim_id: claim-sk2f-phishing-resistance, note: "Both serve as a second factor after a password; SMS codes are not phishing-resistant." }
  - { predicate: alternative_to, object_id: profile-device-bound-passkey-uv, claim_id: claim-sk2f-user-presence-only, note: "Same device-bound key type, but with UV the key itself is multi-factor and no password is needed." }
claims:
  - id: claim-sk2f-phishing-resistance
    predicate: phishing_resistance
    value: conditional
    statement: "The security-key step is phishing-resistant through verifier name binding: the credential is scoped to the RP ID and the signed response includes the origin. The password step is not phishing-resistant, so a phishing site can capture the password, but it cannot produce a valid security-key assertion for the real site."
    scope: The authentication ceremony only; account recovery, fallback second factors and session handling are assessed separately.
    assumptions:
      - "The Relying Party verifies the origin and RP ID hash in every assertion as WebAuthn requires."
      - "No weaker second factor (for example SMS) is offered as a fallback at sign-in."
      - "The user's device and browser are not compromised."
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.2.5 Phishing Resistance, subsection 'Verifier Name Binding' (#verifier-name-binding)"
        note: WebAuthn, used by FIDO2 authenticators, is cited as providing phishing resistance via verifier name binding based on the verifier's authenticated domain.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.w3.org/TR/webauthn-3/
        title: "Web Authentication: An API for accessing Public Key Credentials - Level 3"
        publisher: W3C
        version: "W3C Recommendation, 25 August 2026"
        locator: "§5 Web Authentication API, introductory text"
        note: Authenticator ensures operations are scoped to an origin and cannot be replayed against another origin; the full origin is signed in all assertions.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.1 Passwords (#password), introductory text"
        note: Passwords are not phishing-resistant; this applies to the first step of this profile.
        stance: contextualizes
        retrieved_at: "2026-10-03"
