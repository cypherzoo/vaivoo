  - id: claim-session-token-theft-phishing-resistance-scope
    predicate: defeats_phishing_resistant_authentication
    value: conditional
    statement: "Phishing-resistant authentication prevents cookie theft through a phishing relay, because the relay cannot complete the sign-in. It does not prevent malware on the user's device from copying a bearer cookie after a genuine sign-in. Whether session theft succeeds against a service using phishing-resistant authentication therefore depends on how the cookie is stolen."
    scope: Interpretation combining NIST session and phishing-resistance sections with MITRE ATT&CK mitigations.
    assumptions:
      - "Theft happens on the user's endpoint (malware, injected script) after a legitimate sign-in; via a look-alike-domain relay, phishing-resistant authentication blocks it."
      - "The session secret is a bearer token with no proof-of-possession binding."
