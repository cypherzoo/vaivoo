schema_version: "1.1"
taxonomy_version: "1.0.0"
id: profile-synced-passkey-uv
type: DeploymentProfile
slug: synced-passkey-uv
name: Synced passkey with required user verification
aliases: ["synced passkey (UV required)", "multi-device WebAuthn credential with user verification", "syncable authenticator with UV"]
summary: "A deployment in which the website accepts passkeys that a passkey provider copies across the user's devices, and requires the authenticator to verify the user locally (biometric, PIN or pattern) on every sign-in."
layer: [core, crypto]
status: draft
owner: Chris War
last_verified_at: null
next_review_at: null
configuration:
  user_verification: required
  credential_storage: synchronised across the user's devices by a passkey provider
  backup_eligibility_flag: "BE = 1 expected (multi-device credential)"
  attestation: typically none
  discoverable_credential: typical (passkey)
  recovery: depends on the passkey provider account
body: |
  The user creates a passkey for the website once. The passkey provider then copies it, encrypted, to the user's other devices signed in to the same provider account, so a new phone or laptop can sign in without registering again.

  The website asks for user verification as "required". The browser fails the request if the device cannot verify the user, and the server rejects any response in which the authenticator does not report that the user was verified. In practice the user unlocks the passkey with a fingerprint, face, PIN or pattern.

  Sign-in is bound to the website's domain, which gives strong protection against phishing pages. The weak points move elsewhere: whoever can take over or recover the user's passkey provider account may gain the passkeys, and the website's own account recovery and session handling still need to be assessed separately.

  Under NIST SP 800-63B-4, synced keys are exportable, so this profile can reach at most AAL2; it cannot be used at AAL3.
crypto: |
  Each passkey is a per-site key pair. The private key is used inside the authenticator on the user's device and is never sent to the website. To sign in, the authenticator signs its authenticator data (SHA-256 hash of the RP ID plus flags UP, UV, BE and BS) together with a SHA-256 hash of the client data, which includes the server's random challenge and the origin the browser actually saw. The server checks the signature with the stored public key and verifies origin, RP ID hash and the UV flag.

  Algorithms are identified by COSE identifiers; WebAuthn names -7 (ES256), -8 (EdDSA/Ed25519) and -257 (RS256) as ones user agents must handle for public-key export.

  Syncing means the private key leaves the original device. WebAuthn defines no backup or sync protocol. NIST requires synced keys to be stored only in encrypted form with at least 112-bit strength and recommends a user-controlled secret for that encryption, but how a given passkey provider encrypts and protects the keys is provider-specific.
