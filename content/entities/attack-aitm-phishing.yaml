id: attack-aitm-phishing
type: Attack
slug: aitm-phishing
name: Adversary-in-the-middle phishing
aliases: [AiTM phishing, Real-time phishing relay, Reverse-proxy phishing, Verifier impersonation]
summary: "A fake sign-in page sits between the user and the real service and passes everything through in real time. It defeats passwords, one-time codes, SMS codes and push approvals, and can capture the session cookie. Authenticators that bind their output to the real site's name, such as WebAuthn, resist it."
layer: [core]
status: draft
owner: Christian
last_verified_at: null
next_review_at: null
body: |
  The attacker lures the user to a site that looks like the real sign-in page, usually through a link in an email or message. Behind the scenes, the fake site acts as a relay: it forwards each request to the real service and shows the real responses to the user.

  When the user types a password, the relay passes it on. When the real service asks for a one-time code, an SMS code or a push approval, the user supplies it and the relay passes that on too, while it is still valid. The real service sees a correct sign-in and issues a session cookie, which the relay keeps. The attacker can then use that cookie without needing to sign in again.

  This is why NIST says that any authenticator where the user copies or approves an output by hand is not phishing-resistant. Nothing in the code tells the user, or the service, which website it was typed into. Training users to spot fake sites helps, but NIST's definition of phishing resistance deliberately does not rely on the user's vigilance.

  Phishing-resistant authenticators close this gap with cryptography. With verifier name binding, used by WebAuthn and passkeys, the authenticator signs a response that is tied to the domain the browser is actually talking to. A look-alike domain gets either no response or one the real service rejects. With channel binding, used for example by client-authenticated TLS with smart cards, the response is tied to the specific encrypted connection, so it cannot be replayed over another one.

  Phishing resistance protects the sign-in step. It does not protect a session cookie that is stolen later by other means; see session token theft.
crypto: |
  A one-time code or password is just a value. Whoever submits it first, within its validity window, gets the session. The relay needs no cryptography of its own beyond running a TLS server for its own look-alike domain.

  With verifier name binding, the authenticator's response is a signature over data that includes the verifier identifier the browser authenticated (for WebAuthn, the relying party ID and the origin seen by the browser). The relay's domain differs from the real one, so either no matching credential exists for it, or the signed data names the wrong origin and the real verifier rejects it. NIST requires this identifier to be the authenticated hostname or a parent domain at least one level below the public suffix.

  Channel binding goes further: the signature covers an identifier of the TLS channel itself. A relay terminates its own TLS connection, so the channel identifiers differ, and NIST notes this holds even if the attacker has obtained a certificate for the real verifier's name.
