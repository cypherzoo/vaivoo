  - id: claim-ed25519-deterministic-signing
    predicate: nonce_requirement
    value: supported
    statement: Ed25519 signing is deterministic. The per-signature value is derived from a hash of the private key and the message, so no random number is needed at signing time. This removes bad-randomness failures but not side-channel or fault risks.
    scope: Signature generation; key generation still needs good randomness.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc8032
        title: "RFC 8032: Edwards-Curve Digital Signature Algorithm (EdDSA)"
        publisher: IETF
        version: RFC 8032 (January 2017)
        locator: Section 8.2 (Randomness Considerations); Section 5.1.6 (Sign), steps 1–2
        note: EdDSA signatures are deterministic, protecting against bad-randomness attacks that can reach full key compromise; key generation still needs randomness.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
        title: "FIPS 186-5: Digital Signature Standard (DSS)"
        publisher: NIST
        version: FIPS 186-5 (February 3, 2023)
        locator: Section 7.1 (EdDSA Parameters)
        note: EdDSA signatures are deterministic; care is needed against side-channel and fault attacks, especially in hardware, embedded devices and smartcards.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-ed25519-cose-identifiers
    predicate: algorithm_identifiers
    value: supported
    statement: In COSE, Ed25519 has been signalled as EdDSA (-8) with an OKP key on curve Ed25519 (crv 6). RFC 9864 registers the fully specified Ed25519 (-19) and marks the COSE EdDSA (-8) registration as Deprecated. It also notes that WebAuthn restricts -8 to Ed25519.
    scope: COSE algorithm identifiers as stated in the RFCs; the live IANA registry page was not retrieved.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc9053
        title: "RFC 9053: CBOR Object Signing and Encryption (COSE): Initial Algorithms"
        publisher: IETF
        version: RFC 9053 (August 2022)
        locator: Section 2.2, Table 2 (EdDSA Algorithm Value); Section 7.1 curve table
        note: EdDSA has value -8 and requires kty OKP; curve Ed25519 is crv 6, for use with EdDSA only.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc9864
        title: "RFC 9864: Fully-Specified Algorithms for JOSE and COSE"
        publisher: IETF
        version: RFC 9864 (October 2025, Standards Track)
        locator: Section 1 (Introduction); Section 2.2, Table 2; Sections 4.2.1 and 4.2.2
        note: Registers Ed25519 = -19 (Recommended Yes); EdDSA (-8) becomes Deprecated; cites WebAuthn's workaround "-8 (EdDSA), where crv is 6 (Ed25519)".
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-ed25519-quantum-vulnerable
    predicate: quantum_vulnerability
    value: supported
    statement: Ed25519 would be broken by a sufficiently large quantum computer. NIST lists EdDSA among the quantum-vulnerable signature algorithms threatened by Shor's algorithm.
    scope: Future large-scale quantum adversary; no claim on when such a computer will exist.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc8032
        title: "RFC 8032: Edwards-Curve Digital Signature Algorithm (EdDSA)"
        publisher: IETF
        version: RFC 8032 (January 2017)
        locator: Section 1 (Introduction)
        note: States that a sufficiently large quantum computer would be able to break both Ed25519 and Ed448.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf
        title: "NIST IR 8547 (Initial Public Draft): Transition to Post-Quantum Cryptography Standards"
        publisher: NIST
        version: Initial Public Draft (November 12, 2024)
        locator: Section 2.1.1 (Digital Signature Algorithms)
        note: FIPS 186 algorithms including EdDSA are vulnerable to Shor's algorithm on a cryptographically relevant quantum computer.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-ed25519-nist-transition-timeline
    predicate: deprecation_timeline
    value: conditional
    statement: Under NIST's proposed transition plan, EdDSA at 128-bit security or higher, which includes Ed25519, would be disallowed after 2035.
    scope: NIST-approved (US federal) use; the source is a draft, not final guidance.
    assumptions:
      - NIST IR 8547 is finalized with the dates in the November 2024 initial public draft (as of 2026-10-03 the CSRC page still lists only the draft).
      - Applies to NIST approval status; other jurisdictions and sectors may set different dates.
    claim_type: interpretation
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
