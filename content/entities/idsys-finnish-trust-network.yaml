  - id: claim-ftn-regulated-price
    predicate: regulated_wholesale_price
    value: supported
    statement: A broker pays a means provider at most 3 euro cents per relayed identification event for access. No other access fee may be charged, and Traficom reviews the level every year.
    scope: Wholesale price between means providers and brokers under section 12 c. Retail prices to online services are not regulated by this provision.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
