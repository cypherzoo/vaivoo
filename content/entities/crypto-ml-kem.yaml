  - id: claim-ml-kem-authentication-role
    predicate: authentication_role
    value: supported
    statement: ML-KEM's role in authentication is indirect. It protects the confidentiality of the channel that carries authentication exchanges against "harvest now, decrypt later" attacks, while proving identity still needs a signature or other authentication mechanism. NIST notes that key establishment and authentication algorithms can be migrated on different timelines.
    scope: Interpretation of NIST's use-case discussion; protocol-specific designs (for example KEM-based authentication) are out of scope.
    assumptions: []
