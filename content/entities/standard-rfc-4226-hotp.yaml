        publisher: IETF
        version: RFC 4226 (December 2005)
        locator: Section 5.3 (Generating an HOTP Value)
        note: Implementations MUST extract at least a 6-digit code, possibly 7 or 8; Digit 7 or more SHOULD be considered depending on security needs.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc4226
        title: "RFC 4226: HOTP: An HMAC-Based One-Time Password Algorithm"
        publisher: IETF
        version: RFC 4226 (December 2005)
