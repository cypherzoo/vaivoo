  - id: claim-oauth2-authentication-method-out-of-scope
    predicate: specifies_authentication_method
    value: not_supported
    statement: "OAuth 2.0 does not specify how the user is authenticated. The authorization server must verify the resource owner's identity, but the method (for example password login or session cookies) is beyond the scope of RFC 6749. OAuth 2.0 alone does not convey user authentication to the client; OpenID Connect adds that layer."
    scope: "RFC 6749 core framework. The statement that OAuth alone does not convey authentication relies on OpenID Connect Core's own description of its purpose."
    assumptions: []
    claim_type: interpretation
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc6749.html
        title: The OAuth 2.0 Authorization Framework
        publisher: IETF (RFC Editor)
        version: "RFC 6749, Standards Track"
        publication_date: "2012-10"
        locator: "§3.1 Authorization Endpoint, first paragraph"
        note: The authorization server must first verify the resource owner's identity; how it authenticates them (e.g. password, session cookies) is beyond the specification's scope.
        stance: supports
        retrieved_at: 2026-10-03
