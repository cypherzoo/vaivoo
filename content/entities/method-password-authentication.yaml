claims:
  - id: claim-password-storage
    predicate: storage_requirement
    value: supported
    statement: "NIST requires verifiers to store passwords in a form that resists offline attack: salted (salt at least 32 bits) and hashed with a suitable password hashing scheme that takes a cost factor. The salt and hash are stored for each password."
    scope: Centrally verified passwords under NIST SP 800-63B-4.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.1.2 Password Verifiers (#passwordver), paragraphs on storage and salt"
        note: Passwords SHALL be salted and hashed with a suitable scheme; salt at least 32 bits; cost factor as high as practical; SP 800-132 schemes SHOULD be used.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.1.2 Password Verifiers (#passwordver), paragraph beginning 'In addition, verifiers SHOULD perform an additional iteration'"
        note: Recommends an extra keyed hash or encryption with a verifier-only secret key, stored separately, ideally in hardware-protected storage.
        stance: supports
        retrieved_at: "2026-10-03"
