  - id: claim-oidc-phishing-resistance
    predicate: phishing_resistance
    value: not_applicable
    statement: "Phishing resistance is not a property of OpenID Connect itself. NIST defines it for the authentication protocol between claimant and verifier, and OIDC leaves that step to the OpenID Provider; whether a sign-in is phishing-resistant depends on the authenticator the OP uses."
    scope: Protocol level. Federation-specific threats (e.g. token injection, redirect misuse) are a separate topic and not assessed here.
    assumptions: []
