  - id: claim-saml-post-assertion-signing
    predicate: assertion_signing_required
    value: conditional
    statement: "When the Response is delivered through the browser with the HTTP POST binding, the enclosed assertions must be signed with XML Signature. With the HTTP Artifact binding signing is optional, because the artifact must be dereferenced over a mutually authenticated, integrity-protected and confidential channel. Service providers must verify any signatures present."
    scope: Web Browser SSO Profile message integrity; depends on the binding used.
    assumptions:
      - The service provider holds the identity provider's correct verification key (e.g. from metadata).
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
