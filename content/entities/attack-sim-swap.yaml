  - id: claim-sim-swap-nist-risk-indicators
    predicate: mitigation
    value: supported
    statement: "NIST tells verifiers to consider risk indicators such as device swap, SIM change and number porting before sending a code over the telephone network. It also treats setting or changing the registered phone number as binding a new authenticator, which must follow its binding rules."
    scope: NIST SP 800-63B-4 PSTN out-of-band requirements; how operators expose SIM-change or porting signals is not assessed.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.3.3 Authentication Using the Public Switched Telephone Network (#pstnOOB)"
        note: Verifiers SHOULD consider device swap, SIM change, number porting and other abnormal behaviour before using the PSTN; changing the pre-registered number is binding a new authenticator under Sec. 4.1.2.
        stance: supports
        retrieved_at: "2026-10-03"
  - id: claim-sim-swap-pstn-restricted
    predicate: nist_classification
    value: supported
    statement: "NIST designates out-of-band authentication over the telephone network as a restricted authenticator. Services that accept it must offer an unrestricted alternative at the same assurance level, tell users about the risks, cover them in a risk assessment and plan for migration."
    scope: NIST SP 800-63B-4; NIST may change the restricted status as threats evolve.
    assumptions: []
    claim_type: fact
