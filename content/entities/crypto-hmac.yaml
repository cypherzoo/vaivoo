        publisher: IETF
        version: RFC 2104 (February 1997)
        locator: Section 2 (Definition of HMAC)
        note: Defines ipad (0x36) and opad (0x5C) repeated B times and the nested two-pass hash over the padded key and text.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc2104
        title: "RFC 2104: HMAC: Keyed-Hashing for Message Authentication"
