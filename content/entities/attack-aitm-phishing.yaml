  - id: claim-aitm-phishing-resisted-by-binding
    predicate: defeats_webauthn
    value: not_supported
    statement: "A relay on a look-alike domain does not defeat authenticators with verifier name binding or channel binding. NIST recognises both as phishing resistance and names WebAuthn as an example of verifier name binding. CISA and the UK NCSC both describe FIDO/WebAuthn as phishing-resistant."
    scope: "The authentication step only, with WebAuthn or equivalent bound authenticators used correctly by the relying party. Does not cover a compromised endpoint or browser, a misissued certificate for the real domain (relevant to name binding only), weaker fallback or recovery methods offered alongside, or theft of the session afterwards."
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: C
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
