  - id: claim-oauth2-pkce-required
    predicate: pkce_requirement
    value: conditional
    statement: "Under RFC 9700, public clients must use PKCE to prevent authorization code injection and misuse, and PKCE is recommended for confidential clients (confidential OpenID Connect clients may instead rely on a properly bound nonce). Authorization servers must support PKCE and must reject a code_verifier when no code_challenge was sent. Clients should use S256, currently the only method that does not expose the verifier."
    scope: Authorization Code grant under RFC 9700 §2.1.1; PKCE mechanism per RFC 7636.
    assumptions:
      - The PKCE challenge is transaction-specific and bound to the client and user agent.
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc9700.html
        title: Best Current Practice for OAuth 2.0 Security
        publisher: IETF (RFC Editor)
        version: "RFC 9700, BCP 240"
        publication_date: "2025-01"
        locator: "§2.1.1 Authorization Code Grant"
        note: Public clients MUST use PKCE; RECOMMENDED for confidential clients; AS MUST support PKCE, enforce code_verifier and mitigate PKCE downgrade; S256 is the only method not exposing the verifier.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.rfc-editor.org/rfc/rfc7636.html
        title: Proof Key for Code Exchange by OAuth Public Clients
        publisher: IETF (RFC Editor)
        version: "RFC 7636, Standards Track"
        publication_date: "2015-09"
        locator: "§4.1, §4.2, §4.6, §7.1, §7.2"
        note: Defines code_verifier (43-128 chars, 256-bit entropy recommended), S256 transform as BASE64URL(SHA256(verifier)), mandatory-to-implement S256 on servers, and that plain should not be used.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-oauth2-implicit-grant-discouraged
    predicate: implicit_grant_deprecation
    value: supported
    statement: "RFC 9700 says clients should not use the Implicit grant or other response types that issue access tokens in the authorization response, because those tokens are exposed to leakage and replay and cannot be sender-constrained. Clients should use the Authorization Code grant instead. The Resource Owner Password Credentials grant must not be used."
    scope: "RFC 9700 §2.1.2 and §2.4. The Implicit grant is a SHOULD NOT (with narrow exceptions), not an absolute prohibition; the password grant is a MUST NOT."
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc9700.html
        title: Best Current Practice for OAuth 2.0 Security
        publisher: IETF (RFC Editor)
        version: "RFC 9700, BCP 240"
        publication_date: "2025-01"
        locator: "§2.1.2 Implicit Grant"
        note: Tokens in the authorization response are vulnerable to leakage and replay and cannot be sender-constrained; clients SHOULD NOT use implicit unless injection and leakage are mitigated, and SHOULD use the code response type.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://www.rfc-editor.org/rfc/rfc9700.html
        title: Best Current Practice for OAuth 2.0 Security
        publisher: IETF (RFC Editor)
        version: "RFC 9700, BCP 240"
        publication_date: "2025-01"
        locator: "§2.4 Resource Owner Password Credentials Grant"
        note: The password grant MUST NOT be used because it exposes resource owner credentials to the client and trains users to enter credentials outside the authorization server.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-oauth2-exact-redirect-matching
    predicate: redirect_uri_matching
    value: supported
    statement: "RFC 9700 requires authorization servers to compare redirect URIs with pre-registered URIs using exact string matching, except for the port number of localhost redirect URIs used by native apps. This helps prevent leakage of authorization codes and access tokens. Clients and servers must not expose open redirectors."
    scope: Redirect-based flows under RFC 9700 §2.1.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.rfc-editor.org/rfc/rfc9700.html
        title: Best Current Practice for OAuth 2.0 Security
        publisher: IETF (RFC Editor)
        version: "RFC 9700, BCP 240"
        publication_date: "2025-01"
        locator: "§2.1 Protecting Redirect-Based Flows, paragraphs 1-2"
        note: AS MUST use exact string matching except localhost ports for native apps; prevents code and token leakage and helps detect mix-up; open redirectors MUST NOT be exposed.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-oauth2-openid-connect-layer
    predicate: supports_openid_connect
    value: supported
    statement: "OpenID Connect is built on OAuth 2.0: a client includes the openid scope in an OAuth 2.0 authorization request and receives an ID Token; an access token is also returned in the Authorization Code Flow and response types that request one, while response_type=id_token returns no access token. RFC 9700 allows a properly bound OpenID Connect nonce as an alternative CSRF and code-injection protection for confidential OpenID Connect clients."
    scope: Relationship between OAuth 2.0 and OpenID Connect; see the OpenID Connect entity for its own claims.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
