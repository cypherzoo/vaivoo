claims:
  - id: claim-mfa-fatigue-definition
    predicate: definition
    value: supported
    statement: "MFA fatigue, also called push bombing, is an attack in which repeated authentication requests are sent to the user until they approve one, by accident or to stop the requests. NIST lists it as a distinct authenticator threat, and CISA and MITRE ATT&CK describe the same technique."
    scope: Definition; MITRE notes the same pattern can also use SMS messages or phone calls.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/security/
        title: "NIST SP 800-63B-4: Threats and Security Considerations"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 6.1 Authenticator Threats, Table 3 (#table-3), row 'Authentication Fatigue'"
        note: An attacker causes repeated authentication requests to get the subscriber to approve; example is approving a fraudulent push request to stop repeated requests.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.cisa.gov/sites/default/files/publications/fact-sheet-implement-number-matching-in-mfa-applications-508c.pdf
        title: Implementing Number Matching in MFA Applications (fact sheet)
        publisher: US Cybersecurity and Infrastructure Security Agency (CISA)
        publication_date: "2022-10"
        locator: "Section 'Overview', first paragraph"
        note: MFA fatigue (push bombing) is bombarding a user with push notifications until they approve by accident or out of annoyance.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://attack.mitre.org/techniques/T1621/
        title: "Multi-Factor Authentication Request Generation, Technique T1621 - Enterprise"
