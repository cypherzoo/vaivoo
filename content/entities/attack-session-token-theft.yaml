  - id: claim-session-token-theft-definition
    predicate: definition
    value: supported
    statement: "Session token theft means stealing the cookie or token a service issues after authentication and using it to act as the signed-in user without the credentials. MITRE ATT&CK describes stealing web session cookies this way, and NIST treats hijacking of the session after authentication as a threat with similar impact to authenticator compromise."
    scope: Web session cookies and similar application session secrets; OAuth access and refresh tokens are closely related.
    assumptions: []
    claim_type: fact
    status: approved
