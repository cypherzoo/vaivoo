  - id: claim-eudi-wallet-loa-high
    predicate: assurance_level
    value: supported
    statement: Article 5a(5)(d) requires the wallet, provided under an eID scheme, to meet the requirements for level of assurance high. In the ARF, LoA applies to the PID, and PID private keys must be held in a WSCA/WSCD that meets LoA high.
    scope: Legal requirement as cited by the ARF. LoA applies to the PID only; other attestations have attestation-specific "levels of security".
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eudi.dev/latest/main/02-eudi-wallet-functionalities/
        title: 2 EUDI Wallet functionalities - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Section '2.2 Identification and authentication'"
        note: Cites Article 5a(5)(d) requiring LoA high; Wallet Unit operated under an eID scheme at LoA high; LoA concept applies only to PID.
        stance: supports
        retrieved_at: 2026-10-03
      - url: https://eudi.dev/latest/main/04-high-level-architecture/
        title: 4 High-level architecture - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0
        locator: "Section '4.3.2 Components of a Wallet Unit' (WSCD and Keystore bullets) and '4.5.1 Introduction'"
        note: WSCD assessed at assurance level high per CIR 2024/2981 Annex IV; keystores cannot hold PID keys; two user-authentication mechanisms required.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-eudi-wallet-voluntary
    predicate: voluntary_use
    value: supported
    statement: Citizens do not have to use a wallet under the Regulation. Very large online platforms must accept the wallet for user authentication only when the user voluntarily asks to use it (Article 5f(3)).
    scope: As stated in the ARF, citing the Regulation. Acceptance obligations on other relying parties are not covered here.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: C
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://eudi.dev/latest/main/03-roles-within-the-eudi-wallet-ecosystem/
        title: 3 Roles within the EUDI Wallet ecosystem - Architecture and Reference Framework
        publisher: European Commission (DG CNECT)
        version: ARF v3.0.0 (2026-07-21)
        locator: "Sections '3.2 Users of Wallet Units' and '3.11.1 Relying Parties'"
        note: Use of a Wallet Unit by citizens is not mandatory; Article 5f(3) requires very large platforms to accept it only upon voluntary user request.
        stance: supports
        retrieved_at: 2026-10-03
  - id: claim-eudi-wallet-free-of-charge
    predicate: free_of_charge
