    predicate: minimum_length
    value: supported
    statement: "NIST requires passwords used as a single-factor mechanism to be at least 15 characters. Passwords used only within multi-factor authentication may be shorter but must be at least 8 characters. Verifiers should allow at least 64 characters."
    scope: Centrally verified passwords under NIST SP 800-63B-4; activation secrets (local PINs) have separate rules in Sec. 3.2.10.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://pages.nist.gov/800-63-4/sp800-63b/authenticators/
        title: "NIST SP 800-63B-4: Authenticator and Verifier Requirements"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Sec. 3.1.1.2 Password Verifiers (#passwordver), numbered items 1 and 2"
        note: Single-factor passwords SHALL be at least 15 characters; MFA-only passwords at least eight; maximum length SHOULD be at least 64.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://pages.nist.gov/800-63-4/sp800-63b/passwords/
        title: "NIST SP 800-63B-4: Appendix A. Strength of Passwords"
        publisher: NIST
        version: "SP 800-63B-4 (final, July 2025; HTML edition)"
        locator: "Appendix A (informative), 'Length' (#length)"
        note: Length is a primary factor in password strength; short passwords yield to brute-force and dictionary attacks.
        stance: contextualizes
        retrieved_at: "2026-10-03"
