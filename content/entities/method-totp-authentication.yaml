id: method-totp-authentication
type: Method
slug: totp
name: TOTP authentication
aliases: [Time-based one-time password, TOTP, authenticator-app codes]
summary: "Signing in with a short code computed from a shared secret and the current time. It proves the user holds the secret, but the code is not bound to the website."
layer: [core, crypto]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  At enrollment, the service and the user's authenticator (a phone app or a small hardware token) agree on a secret key, often by scanning a QR code. Both sides also agree on a time step, normally 30 seconds, and a starting time.

  At sign-in, the authenticator combines the secret with the number of time steps since the starting time and shows a short numeric code. The service does the same calculation and accepts the code if it matches. Because clocks drift and codes take time to type, verifiers usually also accept codes from a small number of neighbouring time steps.

  A correct code proves the user had the secret around that moment. It does not prove which website the user typed it into. A fake site can pass the code on to the real one while it is still valid, so TOTP is not phishing-resistant.

  The service keeps its own copy of every user's secret so it can check codes. Those stored secrets must be protected, and the service has to limit failed guesses because a 6-digit code has only a million possible values.
crypto: |
  TOTP is HOTP with a time-based counter: TOTP = HOTP(K, T), where T = floor((current Unix time - T0) / X). By default X = 30 seconds and T0 = 0 (the Unix epoch). See RFC 6238 Sections 4.1 and 4.2.

  HOTP computes HMAC over the 8-byte counter using the shared key K. Dynamic truncation then picks 4 bytes of the MAC (the offset comes from the low 4 bits of the last byte), masks the top bit to give a 31-bit integer, and reduces it modulo 10^Digit (at least 6 digits). See RFC 4226 Section 5.3. RFC 4226 uses HMAC-SHA-1, and RFC 6238 allows HMAC-SHA-256 or HMAC-SHA-512 as well.

  The key is symmetric. The verifier needs the same K to recompute codes, so anyone who can read the verifier's key store can produce valid codes. Because the code is so short, an online attacker could brute-force it, which is why both RFC 4226 and NIST require throttling. Nothing in the computation includes the verifier's identity or the TLS channel, and that is why relayed codes still work.
