        title: OpenID Connect Core 1.0 incorporating errata set 2
        publisher: OpenID Foundation
        version: "Final, incorporating errata set 2, December 15, 2023"
        locator: "§1 Introduction (#Introduction)"
        note: Describes OIDC as an identity layer on OAuth 2.0 because OAuth itself does not define a standard way to convey End-User authentication.
        stance: supports
        retrieved_at: 2026-10-03
