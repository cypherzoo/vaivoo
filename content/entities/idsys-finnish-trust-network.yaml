type: IdentitySystem
slug: finnish-trust-network
name: Finnish Trust Network
aliases: [FTN, Luottamusverkosto, Tunnistuspalvelun tarjoajien luottamusverkosto, Finnish trust network for strong electronic identification]
summary: Finland's statutory network of registered strong electronic identification providers (bank IDs, mobile certificates, the DVV citizen certificate and broker services), supervised by Traficom.
layer: [nordic-eu]
status: published
owner: Chris War
last_verified_at: "2026-10-03"
next_review_at: "2027-04-03"
body: |
  The Finnish Trust Network is not a single eID. It is a network created by law. Its members are the providers of strong electronic identification that have notified the Finnish Transport and Communications Agency (Traficom) and meet the requirements of the Act on Strong Electronic Identification and Electronic Trust Services (617/2009). The network has operated since 1 May 2017.

  There are two roles. Identification means providers give users their eIDs, for example online banking codes from banks, mobile certificates from telecom operators, and the citizen certificate on the police-issued ID card from the Digital and Population Data Services Agency (DVV). Identification broker services sell identification to online services. A means provider must give brokers access to its eID on reasonable, non-discriminatory terms, at a price capped by law. An online service can therefore sign one contract with a broker instead of one with every eID provider.

  Under Finnish law, strong electronic identification must meet eIDAS level of assurance substantial or high. The means must use at least two authentication factors plus dynamic authentication. Traficom's National Cyber Security Centre (NCSC-FI) supervises providers, can prohibit services that do not comply, and keeps a public register of providers. Traficom recommends OpenID Connect and SAML 2.0 profiles for the interfaces between network members.

  On EU notification, the Commission's overview lists one Finnish scheme, the "Citizen Certificate" on the ID card, notified at level high in 2025. No Finnish bank or mobile-certificate scheme appears in that overview. From 1 October 2026, an amendment lets brokers also relay logins based on the European Digital Identity Wallet.
crypto: |
  Some means in the network are based on certificates. Traficom describes a certificate as a signed electronic document that holds the holder's public key, and the Act sets out what identification certificates must contain. DVV's citizen certificate sits on the chip of the police-issued ID card and is used both to log in and to sign. Every means must use dynamic authentication: an electronic proof, created with cryptography or similar techniques, that changes with each login. The sources reviewed do not give the algorithms or key sizes used by individual bank or mobile-certificate means.
