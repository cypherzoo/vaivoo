claims:
  - id: claim-ed25519-fips-approval
    predicate: approval_status
    value: supported
    statement: EdDSA is specified in RFC 8032 (January 2017, Informational) and approved by NIST in FIPS 186-5 (February 2023). SP 800-186 lists Edwards25519 as a recommended curve allowed for EdDSA.
    scope: IETF specification and NIST approval for US federal use.
    assumptions: []
    claim_type: fact
    status: proposed
    review_tier: B
    reviewed_by: []
    reviewed_at: null
    evidence:
      - url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.186-5.pdf
        title: "FIPS 186-5: Digital Signature Standard (DSS)"
        publisher: NIST
        version: FIPS 186-5 (February 3, 2023)
        locator: Section 1 (Introduction), item (3); Section 7.1 (EdDSA Parameters)
        note: EdDSA, specified in RFC 8032, is approved with additional requirements; Ed25519 must use SHA-512.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://doi.org/10.6028/NIST.SP.800-186
        title: "SP 800-186: Recommendations for Discrete Logarithm-based Cryptography: Elliptic Curve Domain Parameters"
        publisher: NIST
        version: SP 800-186 (February 2023)
        locator: Section 3.1, Table 2 (Allowed Usage of the Specified Curves); Section 3.2.3.1 (Edwards25519)
        note: Edwards25519 and Edwards448 are allowed for EdDSA; Edwards25519 is a twisted Edwards curve over GF(2^255 − 19).
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.rfc-editor.org/rfc/rfc8032
        title: "RFC 8032: Edwards-Curve Digital Signature Algorithm (EdDSA)"
        publisher: IETF
        version: RFC 8032 (January 2017)
        locator: Document header (Category Informational); Section 5.1 (Ed25519ph, Ed25519ctx, and Ed25519)
        note: Informational RFC giving recommended EdDSA parameters for edwards25519, with p = 2^255 − 19.
        stance: supports
        retrieved_at: "2026-10-03"
