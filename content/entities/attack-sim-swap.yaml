claims:
  - id: claim-sim-swap-definition
    predicate: definition
    value: supported
    statement: "SIM swapping is a malicious technique in which attackers cause a mobile operator to transfer a victim's phone number to a SIM card the attacker controls. The FBI reports schemes using social engineering that impersonates the victim, bribed operator insiders, or phishing of operator staff to install malware."
    scope: Definition and typical methods; number porting to another operator is covered by NIST's wording (Sec. 3.1.3.3) rather than by these two sources.
    assumptions: []
    claim_type: fact
    status: approved
    review_level: internal
    review_tier: B
    reviewed_by: [Chris War]
    reviewed_at: "2026-10-03"
    evidence:
      - url: https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf
        title: Implementing Phishing-Resistant MFA (fact sheet)
        publisher: US Cybersecurity and Infrastructure Security Agency (CISA)
        publication_date: "2022-10"
        locator: "Section 'Cyber Threats to MFA', bullet 'SIM Swap'"
        note: Describes SIM swap as social engineering of cellular carriers to move the user's number to an attacker-controlled SIM.
        stance: supports
        retrieved_at: "2026-10-03"
      - url: https://www.ic3.gov/PSA/2022/PSA220208
        title: Criminals Increasing SIM Swap Schemes to Steal Millions of Dollars from US Public
        publisher: US Federal Bureau of Investigation, Internet Crime Complaint Center (IC3)
        version: "Alert I-020822-PSA"
        publication_date: "2022-02-08"
        locator: "Section 'How a SIM Swap Scheme Works', first paragraph"
        note: Lists social engineering, insider threat and phishing of carrier employees as the main ways criminals perform SIM swaps.
