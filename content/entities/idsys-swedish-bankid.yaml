  - id: claim-swedish-bankid-eidas-notification
    predicate: eidas_notified
    value: conditional
    statement: Sweden's eID scheme "Swedish eID (Svensk elegitimation)" is NOTIFIED under eIDAS, with BankID listed among its means. However, the Commission's page marks only Freja eID as "(Notified)". Digg lists BankID on file, BankID on card and Mobile BankID as notified at level substantial. The two primary sources disagree on whether BankID itself is notified.
    scope: eIDAS cross-border notification status at retrieval. Scheme-level status is clear; whether BankID as a means is notified is disputed between sources.
    assumptions:
      - "The Commission overview annotation 'Freja eID (Notified)' may mean only Freja appeared in the Official Journal notice 2022/C 78 I/02; that notice was not retrieved."
      - Digg's list may reflect a later notification or a supplement that the Commission page has not yet reflected.
    claim_type: fact
    status: proposed
